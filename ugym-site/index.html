<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gastô</title>
    <meta name="description" content="Gastô: clareza sobre para onde vai o seu dinheiro. Controle de gastos fixos e variáveis, resumo mensal e uma nota que explica o próprio resultado." />

    <!-- instalar na tela inicial -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0d1110" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- o "?v=" existe porque o iOS guarda o ícone da tela inicial em cache -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gastô" />

    <!-- cartão do link -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gastô" />
    <meta property="og:title" content="Gastô: saber para onde foi o dinheiro não deveria dar trabalho" />
    <meta property="og:description" content="Gastos fixos e variáveis separados, resumo mensal e uma nota de 0 a 10 que explica de onde veio." />
    <meta property="og:image" content="./icon-512.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />

    <!-- Abrir a conexão com o banco enquanto o pacote ainda está sendo lido.
         A primeira consulta deixa de pagar DNS e aperto de mão de TLS, que
         é a parte da espera que a gente consegue adiantar sem mudar código.
         O Vite troca o %VITE_SUPABASE_URL% pelo endereço no build. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

          lineChart({height:116, padLeft:26, padRight:36, aria:'Carga máxima de '+exLabel(e),
            series:[{points: m.series.map(function(v,i){ return {y:v, label:shortDate(m.h[i].date)}; }),
                     color:gColor(e.g), width:2.2, dots:true, area:true, endLabel:fmt(m.last)}]}) +
          (m.bw ? '' :
            '<div style="margin-top:14px;padding-top:13px;border-top:1px solid var(--line-soft)">' +
            '<div class="eyebrow" style="margin-bottom:8px">Repetições nessa série</div>' +
            lineChart({height:84, padLeft:26, padRight:30, hideY:true, aria:'Repetições na carga máxima',
              series:[{points: m.repsSeries.map(function(v,i){ return {y:v, label:shortDate(m.h[i].date)}; }),
                       color:'var(--muted)', width:2, dots:true, endLabel:String(m.lastReps)}]}) + '</div>') +
          '<p class="note" style="margin-top:10px">Maior carga de cada dia. Aquecimento fora.</p>' +
        '</div>'
      : '';

    document.getElementById('sheetHost').innerHTML =
      '<div class="scrim" id="scrim3"></div>' +
      '<div class="sheet" role="dialog" aria-label="'+esc(exLabel(e))+'">' +
        '<div class="grabber"></div>' +
        '<div class="spread"><h3>'+esc(e.name)+'</h3><button class="btn ghost sm" id="cargaClose">Fechar</button></div>' +
        '<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">' +
          '<span class="pill" style="background:transparent;border:1px solid '+gColor(e.g)+';color:'+gColor(e.g)+'">'+grupoLabel(e.g)+'</span>' +
          '<span class="chip" style="padding:3px 10px;font-size:12px">'+e.eq+'</span>' +
          '<span class="chip" style="padding:3px 10px;font-size:12px">'+FAM_LABEL[e.fam]+'</span>' +
          (pr ? '<span class="pill">PR '+(pr.bw ? 'PC' : fmt(pr.kg)+' kg')+' × '+pr.reps+'</span>' : '') +
        '</div>' + chartBlock +
        '<div class="card" style="margin-top:12px;padding:14px">' +
          '<div class="eyebrow" style="margin-bottom:10px">Registrar carga avulsa</div>' +
          '<div class="row" style="gap:8px">' +
            '<div class="field" style="flex:1"><input id="cKg" type="number" step="0.5" inputmode="decimal" placeholder="0" aria-label="Carga"><label for="cKg">kg</label></div>' +
            '<div class="field" style="flex:1"><input id="cReps" type="number" inputmode="numeric" placeholder="10" aria-label="Repetições"><label for="cReps">reps</label></div>' +
            '<button class="btn sm" id="cAdd">Salvar</button></div></div>' +
        '<div style="margin-top:18px"><div class="eyebrow" style="margin-bottom:8px">Histórico · '+h.length+' sessões</div>' +
          '<div id="cHist"></div></div>' +
        '<div style="margin-top:20px"><button class="btn danger" id="cDelete">Excluir exercício</button></div>' +
      '</div>';

    lockScroll(true);
    document.getElementById('scrim3').addEventListener('click', closeSheet);
    document.getElementById('cargaClose').addEventListener('click', closeSheet);
    var delArmed = false;
    document.getElementById('cDelete').addEventListener('click', function(){
      var bt = document.getElementById('cDelete');
      if (!delArmed && h.length){
        delArmed = true;
        bt.textContent = 'Confirmar — apaga ' + h.length + ' ' + (h.length === 1 ? 'sessão' : 'sessões') + ' de carga';
        setTimeout(function(){
          if (delArmed){ delArmed = false; if (bt) bt.textContent = 'Excluir exercício'; }
        }, 5000);
        return;
      }
      EXERCISES = EXERCISES.filter(function(x){ return x.id !== exId; });
      WORKOUTS.forEach(function(w){ w.sets = w.sets.filter(function(s){ return s.exercise_id !== exId; }); });
      /* tira da ficha também, senão fica um item fantasma apontando pro nada */
      TREINOS.forEach(function(t){ t.items = t.items.filter(function(i){ return i.ex !== exId; }); });
      if (activeSession){
        activeSession.items = activeSession.items.filter(function(i){
          if (i.ex === exId){ delete activeSession.log[i.uid]; return false; }
          return true;
        });

      reindexEx(); reindexTreinos(); reindexDays(); touchState();
      closeSheet(); renderCargas(); renderTreinoList();
    });

      var kg = parseFloat(document.getElementById('cKg').value);
      var reps = parseInt(document.getElementById('cReps').value, 10);

      viraDia();
      var agora = hoje(), key = dayKey(agora);
      var w = (workoutsByDay[key] || []).filter(function(x){ return x.treino_id === null; })[0];
      if (!w){
        w = {id:newId(), treino_id:null, treino_name:'Avulso', started_at:new Date(), duration_min:0, sets:[], swaps:[]};
        WORKOUTS.push(w); WORKOUTS.sort(function(a,b){ return a.started_at - b.started_at; }); reindexDays();
      }
      var n = w.sets.filter(function(s){ return s.exercise_id === exId; }).length;
      w.sets.push({id:newId(), exercise_id:exId, set_number:n+1, weight_kg:kg||0,
                   reps:reps, bw:!!e.bw, is_warmup:false});
      openCargaSheet(exId); renderCargas(); renderAgenda();
    });

    document.getElementById('cHist').innerHTML = h.map(function(p){
      return '<div class="hist-row">' +

          return '<button class="hb'+(s === p.topSet ? ' top' : '')+'" data-set="'+s.id+'" data-ex="'+exId+'">' +
            (s.bw ? 'PC' : fmt(s.weight_kg))+' × '+s.reps+'</button>';
        }).join('') + '</div></div>';
    }).join('') || '<div class="empty">Sem registros.</div>';

    bindAll(document.getElementById('cHist'), '[data-set]', function(b){
      openSetEditSheet(b.getAttribute('data-set'), exId);
    });
  }

  function findSet(setId){
    for (var i = 0; i < WORKOUTS.length; i++){
      var w = WORKOUTS[i];
      for (var j = 0; j < w.sets.length; j++){
        if (w.sets[j].id === setId) return {w:w, s:w.sets[j]};
      }
    }
    return null;
  }

  function openSetEditSheet(setId, exId){
    var found = findSet(setId);
    if (!found) return;
    var st = found.s, e = exById[exId];
    document.getElementById('sheetHost').innerHTML =
      '<div class="scrim" id="scrimSE"></div>' +
      '<div class="sheet" role="dialog" aria-label="Corrigir série">' +
        '<div class="grabber"></div>' +
        '<div class="spread"><h3>Corrigir série</h3>' +
          '<button class="btn ghost sm" id="seClose">Fechar</button></div>' +
        '<div class="note" style="margin-top:8px">'+e.name+' · '+longDate(found.w.started_at)+' · série '+st.set_number+'</div>' +
        '<div class="row" style="margin-top:16px;gap:8px">' +
          '<div class="field" style="flex:1"><input id="seKg" type="number" step="0.5" inputmode="decimal" value="'+st.weight_kg+'" aria-label="Carga"><label for="seKg">kg</label></div>' +
          '<div class="field" style="flex:1"><input id="seReps" type="number" inputmode="numeric" value="'+st.reps+'" aria-label="Repetições"><label for="seReps">reps</label></div></div>' +

        '<div style="margin-top:12px"><button class="btn danger" id="seDel">Excluir série</button></div></div>';
    lockScroll(true);
    document.getElementById('scrimSE').addEventListener('click', function(){ closeSheet(); openCargaSheet(exId); });
    document.getElementById('seClose').addEventListener('click', function(){ closeSheet(); openCargaSheet(exId); });
    document.getElementById('seSave').addEventListener('click', function(){
      var kg = parseFloat(document.getElementById('seKg').value);
      var reps = parseInt(document.getElementById('seReps').value, 10);
      if (!isNaN(kg)) st.weight_kg = kg;
      if (reps) st.reps = reps;
      closeSheet(); openCargaSheet(exId); renderCargas(); toast('Série corrigida');
    });
    document.getElementById('seDel').addEventListener('click', function(){
      found.w.sets = found.w.sets.filter(function(x){ return x.id !== setId; });
      reindexDays(); closeSheet(); openCargaSheet(exId); renderCargas(); toast('Série excluída');
    });
  }

  document.getElementById('cargaSearch').addEventListener('input', function(ev){
    cargaQuery = ev.target.value.trim().toLowerCase(); renderCargas();
  });

  /* ===================== EDITOR DE FICHA ===================== */
  var edDraft = null;

  function openFichaEditor(tid){
    var t = tid ? treinoById[tid] : null;
    edDraft = t
      ? {id:t.id, name:t.name, dow:t.dow, items:t.items.map(function(i){
          return {ex:i.ex, sets:i.sets, warm:i.warm||0, rmin:i.rmin, rmax:i.rmax, reps:i.reps ? i.reps.slice() : []};
        })}
      : {id:null, name:'', dow:today.getDay(), items:[]};
    renderFichaEditor();
  }

  function renderFichaEditor(){
    var d = edDraft;
    document.getElementById('sheetHost').innerHTML =
      '<div class="scrim" id="scrimE"></div>' +
      '<div class="sheet" role="dialog" aria-label="Editar ficha">' +
        '<div class="grabber"></div>' +
        '<div class="spread"><h3>'+(d.id ? 'Editar treino' : 'Novo treino')+'</h3>' +
          '<button class="btn ghost sm" id="edClose">Fechar</button></div>' +
        '<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Nome</div>' +
          '<input class="txt" id="edName" type="text" value="'+d.name.replace(/"/g,'&quot;')+'" placeholder="nome do treino" aria-label="Nome do treino"></div>' +
        '<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Dia sugerido</div>' +
          '<div class="dow" id="edDow">' + WEEKDAYS.map(function(w, i){
            return '<button class="dow-b'+(d.dow===i?' on':'')+'" data-dow="'+i+'">'+w.charAt(0)+'</button>';
          }).join('') + '</div></div>' +
        '<div style="margin-top:20px"><div class="spread" style="margin-bottom:9px">' +
          '<div class="eyebrow">Exercícios</div>' +
          '<span class="note">'+d.items.reduce(function(a,i){ return a+i.sets; },0)+' séries válidas · ' +
            d.items.reduce(function(a,i){ return a+(i.warm||0); },0)+' de aquecimento</span></div>' +
          '<div id="edList"></div>' +
          '<button class="btn dashed" id="edAdd" style="margin-top:4px">+ Adicionar exercício</button></div>' +

    document.getElementById('scrimE').addEventListener('click', closeEditor);
    document.getElementById('edClose').addEventListener('click', closeEditor);
    document.getElementById('edName').addEventListener('input', function(ev){ d.name = ev.target.value; });
    bindAll(document.getElementById('edDow'), '[data-dow]', function(b){
      d.dow = +b.getAttribute('data-dow'); renderFichaEditor();
    });
    document.getElementById('edAdd').addEventListener('click', function(){ openExPicker(); });
    document.getElementById('edSave').addEventListener('click', saveFicha);
    renderEdList();

  function renderEdList(){
    var d = edDraft, host = document.getElementById('edList');
    if (!host) return;
    if (!d.items.length){
      host.innerHTML = '<div class="note" style="padding:10px 2px 14px">Nenhum exercício ainda.</div>';
      return;
    }
    host.innerHTML = d.items.map(function(it, i){
      var e = exById[it.ex];
      if (!e) return '';
      return '<div class="ed-row" style="display:block">' +
        '<div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start">' +
          '<span><span class="ed-n">'+esc(e.name)+'</span>' +
            '<span class="ed-e" style="color:'+gColor(e.g)+'">'+grupoLabel(e.g)+' · '+e.eq+'</span></span>' +
          '<button class="ed-x" data-del="'+i+'" aria-label="Remover">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
        '<div class="ed-grid">' +
          '<div class="ed-f"><label>Válidas</label><input type="number" inputmode="numeric" min="1" value="'+it.sets+'" data-f="sets" data-i="'+i+'" aria-label="Séries válidas"></div>' +
          '<div class="ed-f"><label>Aquec.</label><input type="number" inputmode="numeric" min="0" value="'+(it.warm||0)+'" data-f="warm" data-i="'+i+'" aria-label="Séries de aquecimento"></div>' +
          '<div class="ed-f"><label>Rep mín</label><input type="number" inputmode="numeric" min="1" value="'+(it.rmin||'')+'" data-f="rmin" data-i="'+i+'" aria-label="Repetições mínimas"></div>' +
          '<div class="ed-f"><label>Rep máx</label><input type="number" inputmode="numeric" min="1" value="'+(it.rmax||'')+'" data-f="rmax" data-i="'+i+'" aria-label="Repetições máximas"></div>' +
        '</div></div>';
    }).join('');

    bindAll(host, '[data-del]', function(b){
      d.items.splice(+b.getAttribute('data-del'), 1); renderFichaEditor();
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-f]'), function(inp){
      inp.addEventListener('input', function(){
        var i = +inp.getAttribute('data-i'), f = inp.getAttribute('data-f');
        var v = parseInt(inp.value, 10);
        if (isNaN(v)){ if (f === 'rmin' || f === 'rmax') d.items[i][f] = null; return; }
        d.items[i][f] = (f === 'warm') ? Math.max(0, v) : Math.max(1, v);
      });
    });
  }

  function saveFicha(){
    var d = edDraft;
    if (!d.name.trim()){ document.getElementById('edName').focus(); return; }
    if (!d.items.length){ toast('Adicione pelo menos um exercício'); return; }
    d.items.forEach(function(it){
      if (it.rmin && it.rmax && it.rmax < it.rmin) it.rmax = it.rmin;
    });
    if (d.id){
      var t = treinoById[d.id];
      t.name = d.name.trim(); t.dow = d.dow; t.weekday = WEEKDAYS[d.dow];
      t.items = d.items.map(function(i){
        return {ex:i.ex, sets:i.sets, warm:i.warm, rmin:i.rmin, rmax:i.rmax, reps:i.reps};
      });
    } else {
      TREINOS.push({
        id:newId(), name:d.name.trim(), weekday:WEEKDAYS[d.dow], dow:d.dow, archived:false,
        items: d.items.map(function(i){
          return {ex:i.ex, sets:i.sets, warm:i.warm, rmin:i.rmin, rmax:i.rmax, reps:i.reps};
        })
      });
      reindexTreinos();
    }
    reindexTreinos();
    edDraft = null;
    saveState();
    closeEditor();
    if (openTreinoId) renderTreinoDetail(); else renderTreinoList();
    renderCargas();
    toast('Ficha salva');
  }

  function closeEditor(){
    document.getElementById('sheetHost').innerHTML = '';
    lockScroll(false);
    renderTreinoList();
    if (openTreinoId && !document.getElementById('treinoDetail').hidden) renderTreinoDetail();
  }

  var pickQuery = '';
  function openExPicker(){
    pickQuery = '';
    document.getElementById('sheetHost').innerHTML =
      '<div class="scrim" id="scrimPk"></div>' +
      '<div class="sheet" role="dialog" aria-label="Escolher exercício">' +
        '<div class="grabber"></div>' +
        '<div class="spread"><h3>Adicionar exercício</h3>' +
          '<button class="btn ghost sm" id="pkBack">Voltar</button></div>' +
        '<div class="search" style="margin-top:14px;margin-bottom:14px">' +
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
          '<input id="pkSearch" type="search" placeholder="Buscar ou criar..." aria-label="Buscar exercício"></div>' +
        '<button class="btn dashed" id="pkNew" style="margin-bottom:14px">+ Criar exercício novo</button>' +
        '<div id="pkBody"></div></div>';

      openNewExercise(function(e){
        edDraft.items.push({ex:e.id, sets:3, warm:0, rmin:null, rmax:null, reps:[]});

      }, openExPicker, document.getElementById('pkSearch').value.trim());

  function renderPkBody(){
    var host = document.getElementById('pkBody');

      return !pickQuery || exLabel(e).toLowerCase().indexOf(pickQuery) >= 0 || grupoLabel(e.g).toLowerCase().indexOf(pickQuery) >= 0;

    var byGroup = {};
    list.forEach(function(e){ (byGroup[e.g] = byGroup[e.g] || []).push(e); });

            '<span><span class="n">'+e.name+'</span><span class="e">'+e.eq+'</span></span>' +
            '<span class="l">'+(historyFor(e.id).length ? historyFor(e.id).length + ' sessões' : '–')+'</span></button>';
        }).join('');
    }).join('') || '<div class="empty">Nada encontrado. Crie um exercício novo.</div>';
    bindAll(host, '[data-pick]', function(b){
      edDraft.items.push({ex:b.getAttribute('data-pick'), sets:3, warm:0, rmin:null, rmax:null, reps:[]});
      renderFichaEditor();

  /* onCreate(e) decide o que fazer com o exercício criado; onBack volta de onde veio */
  function openNewExercise(onCreate, onBack, nomeInicial){
    var draft = {name: nomeInicial || '', g:'peito', eq:'Halter'};
    function render(){
      var aviso = '';
      var dup = draft.name.trim() ? exerciseExists(draft.name, draft.eq) : null;
      if (dup) aviso = '<div class="note" style="margin-top:10px;color:var(--accent-ink)">Já existe: ' +
        exLabel(dup) + '. Mude o nome ou o equipamento.</div>';
      document.getElementById('sheetHost').innerHTML =
        '<div class="scrim" id="scrimNx"></div>' +
        '<div class="sheet" role="dialog" aria-label="Criar exercício">' +
          '<div class="grabber"></div>' +
          '<div class="spread"><h3>Novo exercício</h3>' +
            '<button class="btn ghost sm" id="nxBack">Voltar</button></div>' +
          '<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Nome</div>' +
            '<input class="txt" id="nxName" type="text" value="'+draft.name.replace(/"/g,'&quot;')+'" placeholder="Supino Inclinado" aria-label="Nome"></div>' +
          '<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Onde é feito</div>' +
            '<div class="chips">' + EQUIP.map(function(q){
              return '<button class="chip" data-q="'+q+'" aria-pressed="'+(draft.eq===q)+'"'+
                (draft.eq===q?' style="border-color:var(--accent);color:var(--text)"':'')+'>'+q+'</button>';
            }).join('') + '</div></div>' +
          '<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Parte do corpo</div>' +
            '<div class="chips">' + GROUP_ORDER.map(function(g){
              return '<button class="chip" data-g="'+g+'" aria-pressed="'+(draft.g===g)+'"'+
                (draft.g===g?' style="border-color:'+gColor(g)+';color:'+gColor(g)+'"':'')+'>'+GROUPS[g].label+'</button>';
            }).join('') + '</div></div>' +
          aviso +
          '<div style="margin-top:20px"><button class="btn" id="nxSave">Criar exercício</button>' +
          '<p class="note" style="margin-top:8px;text-align:center">Fica salvo em Cargas para sempre.</p></div>' +
        '</div>';
      lockScroll(true);
      document.getElementById('scrimNx').addEventListener('click', onBack);
      document.getElementById('nxBack').addEventListener('click', onBack);
      var inp = document.getElementById('nxName');
      inp.addEventListener('input', function(ev){
        draft.name = ev.target.value;
        var el = document.querySelector('.sheet .note[style*="accent-ink"]');
        var d2 = draft.name.trim() ? exerciseExists(draft.name, draft.eq) : null;
        if (!!d2 !== !!el) render();
      });
      bindAll(document.querySelector('.sheet'), '[data-g]', function(b){ draft.g = b.getAttribute('data-g'); render(); });
      bindAll(document.querySelector('.sheet'), '[data-q]', function(b){ draft.eq = b.getAttribute('data-q'); render(); });
      document.getElementById('nxSave').addEventListener('click', function(){
        var nome = draft.name.trim();
        if (!nome){ document.getElementById('nxName').focus(); return; }
        if (exerciseExists(nome, draft.eq)){ render(); return; }
        var e = {id:newId(), name:nome, g:draft.g, eq:draft.eq, fam:famDe(nome, draft.g)};
        if (draft.eq === 'Peso corporal') e.bw = true;
        EXERCISES.push(e); reindexEx(); touchState();
        renderCargas();
        toast('“' + exLabel(e) + '” criado');
        onCreate(e);
      });
      if (nomeInicial) inp.focus();

  function exportText(kind){
    var L = [], line = '─────────────────────────────';
    L.push('»UGYM');
    L.push(kind === 'cardio' ? 'PROTOCOLOS DE CARDIO' : 'FICHA DE TREINO');
    L.push(longDate(today) + ' de ' + today.getFullYear());
    L.push('');
    if (kind === 'cardio'){
      activeCardios().forEach(function(c){
        L.push(c.name.toUpperCase());
        L.push(line);
        partsDe(c).forEach(function(pt){
          L.push('  ' + daysLabel(pt.days).padEnd(12, ' ') + ' ' + (pt.tipo || '?'));
          var a = alvoTexto(pt.target || {});
          if (a) L.push('               ' + a);
        });
        if (c.note) L.push('  Obs.         ' + c.note);
        L.push('');
      });
    } else {
      activeTreinos().forEach(function(t){
        L.push(t.name.toUpperCase() + '   ·   ' + t.weekday);
        L.push(line);
        t.items.forEach(function(it, i){
          var e = exById[it.ex];
          if (!e) return;
          L.push('  ' + String(i+1).padStart(2,'0') + '  ' + e.name);
          L.push('      ' + (it.rmin && it.rmax ? it.sets + ' × ' + it.rmin + '–' + it.rmax
                 : it.sets + ' series') + (it.warm ? ' (+' + it.warm + ' aquec)' : '') +
                 '   ·   ' + e.eq + '   ·   ' + grupoLabel(e.g));
        });
        L.push('');
        L.push('      Total: ' + t.items.length + ' exercícios · ' + t.items.reduce(function(a,i){ return a+i.sets; },0) + ' séries');
        L.push('');
      });
    }
    L.push(line);
    L.push('Gerado pelo UGYM');
    return L.join('\n');
  }

  function importText(raw, kind){
    if (!raw || raw.trim().length < 10) return 'Cole um texto exportado primeiro.';
    if (kind === 'cardio') return 'Importação de cardio ainda não implementada no protótipo.';
    var lines = raw.split('\n'), created = 0, current = null, pending = null, novos = [];
    lines.forEach(function(ln){
      var header = ln.match(/^([^\s].*?)\s+·\s+(Seg|Ter|Qua|Qui|Sex|Sáb|Dom)\s*$/);
      if (header && header[1] === header[1].toUpperCase()){
        var nm = header[1].trim();
        current = {id:newId(),
                   name: nm.charAt(0) + nm.slice(1).toLowerCase(),
                   weekday: header[2], dow: WEEKDAYS.indexOf(header[2]), archived:false, items:[]};
        TREINOS.push(current); novos.push(current.id); reindexTreinos(); created++; pending = null;
        return;
      }
      var exLine = ln.match(/^\s{2}\d{2}\s{2}(.+?)\s*$/);
      if (exLine && current){ pending = exLine[1].trim(); return; }
      var spec = ln.match(/^\s{6}(\d+)\s*×\s*(\d+)[–-](\d+)\s*·\s*(.+?)\s*·\s*(.+?)\s*$/);
      if (spec && current && pending){
        var nome = pending, equip = spec[4].trim();
        var found = EXERCISES.filter(function(e){
          return semAcento(e.name) === semAcento(nome) && semAcento(e.eq) === semAcento(equip);
        })[0];
        if (!found){
          var grp = GROUP_ORDER.filter(function(g){ return GROUPS[g].label === spec[5].trim(); })[0] || 'peito';
          found = {id:newId(), name:nome, g:grp, eq:equip, fam:famDe(nome, grp)};
          EXERCISES.push(found); reindexEx();
        }
        current.items.push({ex:found.id, sets:+spec[1], rmin:+spec[2], rmax:+spec[3], reps:[]});
        pending = null;
      }
    });
    TREINOS = TREINOS.filter(function(t){ return t.items.length > 0 || novos.indexOf(t.id) < 0; });
    reindexTreinos();
    return created ? created + ' treino' + (created>1?'s':'') + ' importado' + (created>1?'s':'') + '.' : 'Não reconheci nenhum treino no texto.';
  }

    var pw = document.getElementById('phWipe'), pwArmed = false;
    if (pw) pw.addEventListener('click', function(){
      if (!pwArmed){
        pwArmed = true; pw.textContent = 'Confirmar — apagar as ' + PHOTOS.length + ' fotos';
        setTimeout(function(){ if (pwArmed){ pwArmed = false; if (pw) pw.textContent = 'Excluir todas as fotos'; } }, 6000);
        return;
      }
      var paths = PHOTOS.map(function(x){ return x.path; }).filter(Boolean);
      PHOTOS = [];
      touchState();
      cloudPhotosDel(paths);
      renderFotos();
      toast('Todas as fotos foram excluídas');
    });

    /* link vencido: pede outro e redesenha */
    Array.prototype.forEach.call(host.querySelectorAll('[data-pimg]'), function(img){
      img.addEventListener('error', function(){
        var ph = PHOTOS.filter(function(x){ return x.id === img.getAttribute('data-pimg'); })[0];
        if (!ph || !ph.path) return;
        ph.tries = (ph.tries || 0) + 1;

    var input = document.getElementById('fotoInput');
    document.getElementById('fotoAdd').addEventListener('click', function(){ input.click(); });
    input.addEventListener('change', function(){
      var files = Array.prototype.slice.call(input.files || []);
      if (!files.length) return;
      var pending = files.length;
      files.forEach(function(f){
        var r = new FileReader();
        r.onload = function(){
          var img = new Image();
          img.onload = function(){
            var max = 900, w = img.width, h = img.height;
            if (w > max || h > max){ var k = max / Math.max(w, h); w = Math.round(w*k); h = Math.round(h*k); }
            var cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            var src;
            try { src = cv.toDataURL('image/jpeg', 0.7); } catch(err){ src = r.result; }
            var nph = {id:newId(), date:new Date(), src:src};
            PHOTOS.push(nph); cloudPhotoUp(nph);
            if (--pending === 0){
              PHOTOS.sort(function(a,b){ return a.date - b.date; });
              saveState(); renderFotos();
              toast(files.length + (files.length>1 ? ' fotos adicionadas' : ' foto adicionada'));
            }
          };
          img.onerror = function(){ if (--pending === 0){ renderFotos(); } };
          img.src = r.result;
        };
        r.readAsDataURL(f);
      });
      input.value = '';
    });
    bindAll(host, '[data-ph]', function(b){ openFotoSheet(b.getAttribute('data-ph')); });
  }

  function openFotoSheet(id){
    var ph = PHOTOS.filter(function(x){ return x.id === id; })[0];
    if (!ph) return;
    var idx = PHOTOS.indexOf(ph);
    var prev = idx > 0 ? PHOTOS[idx-1] : null;
    var days = prev ? Math.round((ph.date - prev.date)/86400000) : null;
    document.getElementById('sheetHost').innerHTML =
      '<div class="scrim" id="scrimF"></div>' +
      '<div class="sheet" role="dialog" aria-label="Foto de '+longDate(ph.date)+'">' +
        '<div class="grabber"></div>' +
        '<div class="spread"><h3>'+longDate(ph.date)+'</h3>' +
          '<button class="btn ghost sm" id="fClose">Fechar</button></div>' +
        (days !== null ? '<div class="note" style="margin-top:7px">'+days+' dias depois do registro anterior</div>' : '') +
        (ph.src
          ? '<img class="ph-full" src="'+ph.src+'" alt="Registro de '+longDate(ph.date)+'">'
          : '<div class="empty">Carregando a foto…</div>') +
        '<div style="margin-top:16px"><button class="btn danger" id="fDel">Excluir foto</button></div></div>';
    lockScroll(true);
    document.getElementById('scrimF').addEventListener('click', closeFoto);
    document.getElementById('fClose').addEventListener('click', closeFoto);
    var fd = document.getElementById('fDel'), fdArmed = false;
    fd.addEventListener('click', function(){
      if (!fdArmed){
        fdArmed = true; fd.textContent = 'Confirmar — apagar esta foto';
        setTimeout(function(){ if (fdArmed){ fdArmed = false; if (fd) fd.textContent = 'Excluir foto'; } }, 5000);
        return;
      }
      cloudPhotoDel(ph.path);
      PHOTOS = PHOTOS.filter(function(x){ return x.id !== id; });
      touchState();
      closeFoto();
      toast('Foto excluída');
    });
  }
  function closeFoto(){
    document.getElementById('sheetHost').innerHTML = '';
    lockScroll(false);
    renderFotos();
  }

  /* ===================== PESO ===================== */
  function movingAvg(arr, k){
    return arr.map(function(_, i){
      var slice = arr.slice(Math.max(0, i-k+1), i+1);
      return Math.round(slice.reduce(function(a,b){ return a + b.weight_kg; }, 0)/slice.length*10)/10;
    });
  }
  function renderPeso(){
    touchState();
    var headEl = document.getElementById('pesoHead');
    if (!headEl) return;
    headEl.innerHTML = '<div class="page-head">'+watermark()+'<div><h1 class="page">Peso</h1>' +
      '<div class="page-sub">Peso corporal ao longo do tempo</div></div></div>';

    if (!BODY.length){
      document.getElementById('weightTiles').innerHTML = '';
      document.getElementById('weightChartWrap').innerHTML =
        '<div class="empty">Registre a primeira pesagem para o gráfico aparecer.</div>';
      document.getElementById('weightList').innerHTML = '<div class="empty">Nenhuma pesagem ainda.</div>';
      return;
    }
    var avg = movingAvg(BODY, 3);
    var latest = BODY[BODY.length-1], first = BODY[0], prev = BODY[BODY.length-2];
    var delta = Math.round((latest.weight_kg - first.weight_kg)*10)/10;
    var dWeek = prev ? Math.round((latest.weight_kg - prev.weight_kg)*10)/10 : 0;
    document.getElementById('weightTiles').innerHTML =
      tile(fmt(latest.weight_kg,1), 'kg', 'Peso atual') +
      tile((delta>=0?'+':'')+fmt(delta,1), 'kg', 'Desde o início') +
      tile((dWeek>=0?'+':'')+fmt(dWeek,1), 'kg', 'Última pesagem');
    document.getElementById('weightChartWrap').innerHTML = lineChart({
      height:160, padRight:40, aria:'Evolução do peso corporal',
      series:[
        {points: BODY.map(function(b){ return {y:b.weight_kg, label:shortDate(b.date)}; }), color:'var(--dim)', width:1.5},
        {points: BODY.map(function(b,i){ return {y:avg[i], label:shortDate(b.date)}; }), color:'var(--accent)', width:2.4, area:true, endLabel:fmt(avg[avg.length-1],1)}
      ]
    });
    var listHost = document.getElementById('weightList');
    listHost.innerHTML = BODY.slice().reverse().slice(0,10).map(function(b,i,arr){
      var next = arr[i+1];
      var d = next ? Math.round((b.weight_kg - next.weight_kg)*10)/10 : null;
      return '<button class="w-row" data-peso="'+b.id+'">' +
        '<span class="w-date">'+shortDate(b.date)+'</span>' +
        '<span class="w-kg">'+fmt(b.weight_kg,1)+' <span style="font-size:11px;color:var(--muted);font-weight:400">kg</span></span>' +
        '<span class="w-delta">'+(d === null ? '–' : (d>0?'+':'')+fmt(d,1))+'</span></button>';
    }).join('');
    bindAll(listHost, '[data-peso]', function(b){ openPesoSheet(b.getAttribute('data-peso')); });
  }
  function tile(v, unit, k){
    return '<div class="tile"><div class="v">'+v+'<span>'+unit+'</span></div><div class="k">'+k+'</div></div>';
  }

  function openPesoSheet(id){
    var b = BODY.filter(function(x){ return x.id === id; })[0];
    if (!b) return;
    document.getElementById('sheetHost').innerHTML =
      '<div class="scrim" id="scrimP"></div>' +
      '<div class="sheet" role="dialog" aria-label="Editar pesagem">' +
        '<div class="grabber"></div>' +
        '<div class="spread"><h3>Pesagem de '+longDate(b.date)+'</h3>' +
          '<button class="btn ghost sm" id="pClose">Fechar</button></div>' +
        '<div class="row" style="margin-top:16px;gap:8px">' +
          '<div class="field" style="flex:1"><input id="pKg" type="number" step="0.1" inputmode="decimal" value="'+b.weight_kg+'" aria-label="Peso"><label for="pKg">kg</label></div>' +
          '<button class="btn sm" id="pSave">Salvar</button></div>' +
        '<div style="margin-top:18px"><button class="btn danger" id="pDel">Excluir esta pesagem</button></div></div>';
    lockScroll(true);
    document.getElementById('scrimP').addEventListener('click', closeSheet);
    document.getElementById('pClose').addEventListener('click', closeSheet);
    document.getElementById('pSave').addEventListener('click', function(){
      var v = parseFloat(String(document.getElementById('pKg').value).replace(',','.'));
      if (v > 0) b.weight_kg = Math.round(v*10)/10;
      closeSheet();
    });
    document.getElementById('pDel').addEventListener('click', function(){
      BODY = BODY.filter(function(x){ return x.id !== id; });
      closeSheet();
    });
  }

  document.getElementById('weightSave').addEventListener('click', function(){
    var el = document.getElementById('weightInput');
    var v = parseFloat(String(el.value).replace(',','.'));
    if (!v || v <= 0){ el.focus(); return; }
    var k = dayKey(today);
    var existing = BODY.filter(function(b){ return b.measured_on === k; })[0];
    if (existing) existing.weight_kg = Math.round(v*10)/10;
    else {
      BODY.push({id:newId(), measured_on:k, date:new Date(today), weight_kg: Math.round(v*10)/10});
      BODY.sort(function(a,b){ return a.date - b.date; });
    }
    el.value = ''; renderPeso();
  });

  /* ===================== tabs ===================== */
  var SCREENS = {treinos:'tab-treinos', cardio:'tab-cardio', cargas:'tab-cargas', fotos:'tab-fotos', peso:'tab-peso'};
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(btn){
    btn.addEventListener('click', function(){
      var name = btn.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
        b.setAttribute('aria-selected', String(b === btn));
      });
      Object.keys(SCREENS).forEach(function(k){ document.getElementById(SCREENS[k]).hidden = (k !== name); });
      document.getElementById('tab-agenda').hidden = true;
      scrollTop();
      if (name === 'treinos' && document.getElementById('treinoDetail').hidden) renderTreinoList();
      if (name === 'cardio') renderCardio();
      if (name === 'cargas') renderCargas();
      if (name === 'fotos'){ renderFotos(); photoUrls(); }
      if (name === 'peso') renderPeso();
    });
  });

  function showAgenda(){
    Object.keys(SCREENS).forEach(function(k){ document.getElementById(SCREENS[k]).hidden = true; });
    document.getElementById('tab-agenda').hidden = false;
    renderAgenda();
    scrollTop();
  }
  document.getElementById('agendaBack').addEventListener('click', function(){
    document.getElementById('tab-agenda').hidden = true;
    document.getElementById('tab-treinos').hidden = false;
    scrollTop();
  });

  document.getElementById('syncDot').addEventListener('click', accountSheet);
  document.getElementById('todayLabel').addEventListener('click', accountSheet);

  function renderAll(){
    renderTop(); renderTreinoList(); renderCardio();
    renderCargas(); renderAgenda(); renderPeso(); renderFotos();
  }

  loadState();
  migrateIds();
  renderAll();
  cloudBoot();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>

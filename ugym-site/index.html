<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0B0B0D">
<meta name="description" content="Ficha de treino, cargas, cardio, peso e fotos.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UGYM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{ color-scheme: dark light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: 0; }
  html, body{ height: 100%; }
  body{ margin:0; font:14px system-ui, sans-serif; background:#0B0B0D; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<title>UGYM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap">

<style>
  :root{
    --bg:#0B0B0D; --surface:#141417; --surface-2:#1C1C21;
    --line:#2A2A31; --line-soft:#212127;
    --text:#F4F3F1; --muted:#96919A; --dim:#66626C;
    --accent:#E1223A; --accent-ink:#FF4459; --accent-soft:rgba(225,34,58,.16);
    --good:#3FB27F; --grid:#25252C;
    --shadow:0 12px 36px rgba(0,0,0,.55);
    --g-push:#E4485A; --g-pull:#2AA5B8; --g-legs:#8B7BE8; --g-core:#BE8A28;
    --cardio:#E8763C;
    --wash:.26; --emboss-hi:rgba(255,255,255,.16); --emboss-lo:rgba(0,0,0,.6);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#EDEBE7;
      --line:#DFDCD6; --line-soft:#E9E6E1;
      --text:#17161A; --muted:#6A656F; --dim:#928D97;
      --accent:#C8152C; --accent-ink:#B31226; --accent-soft:rgba(200,21,44,.10);
      --good:#1F8256; --grid:#E6E3DD;
      --shadow:0 12px 32px rgba(23,22,26,.13);
      --g-push:#C8152C; --g-pull:#0F8FA3; --g-legs:#6B4FD0; --g-core:#A8761C;
      --cardio:#C2561F;
      --wash:.14; --emboss-hi:rgba(255,255,255,.9); --emboss-lo:rgba(23,22,26,.16);
    }
  }
  :root[data-theme="light"]{
    --bg:#F5F4F1; --surface:#FFFFFF; --surface-2:#EDEBE7;
    --line:#DFDCD6; --line-soft:#E9E6E1;
    --text:#17161A; --muted:#6A656F; --dim:#928D97;
    --accent:#C8152C; --accent-ink:#B31226; --accent-soft:rgba(200,21,44,.10);
    --good:#1F8256; --grid:#E6E3DD;
    --shadow:0 12px 32px rgba(23,22,26,.13);
    --g-push:#C8152C; --g-pull:#0F8FA3; --g-legs:#6B4FD0; --g-core:#A8761C;
    --cardio:#C2561F;
    --wash:.14; --emboss-hi:rgba(255,255,255,.9); --emboss-lo:rgba(23,22,26,.16);
  }

  *{box-sizing:border-box}
  html{height:100%}
  body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 52% at 50% -8%, color-mix(in srgb, var(--accent) calc(var(--wash)*100%), transparent), transparent 68%),
      radial-gradient(80% 36% at 100% 102%, color-mix(in srgb, var(--accent) calc(var(--wash)*38%), transparent), transparent 72%);
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none;text-align:left}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

  .app{
    max-width:460px;margin:0 auto;padding:0 16px;position:relative;z-index:1;
    height:100%;display:flex;flex-direction:column;
  }
  .app > main{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    padding-bottom:calc(84px + max(0px, env(safe-area-inset-bottom, 0px) - 26px));
    scrollbar-gutter:stable;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 12px);
    mask-image:linear-gradient(to bottom, transparent 0, #000 12px);
  }
  body.locked .app > main{overflow:hidden}
  .topbar{
    flex:none;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;
    background:var(--bg);
  }
  .logo{display:flex;align-items:center;gap:7px}
  .logo svg{display:block}
  .logo-word{font-family:Archivo,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1}
  .logo-word em{font-style:normal;color:var(--accent)}
  .topbar .today{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
  .topbar .right{display:flex;align-items:center;gap:10px}
  .sync{display:flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:none;border-radius:9px;background:none;color:var(--dim);flex:none;transition:color .2s ease}
  .sync svg{display:block}
  .sync:hover{color:var(--muted)}
  .sync.ok{color:var(--accent)}
  .sync.busy{color:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  .sync.off,.sync.err{color:#C9A227}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
  @media (prefers-reduced-motion: reduce){ .sync.busy{animation:none} }
  .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-top:4px}
  .seg button{padding:9px 2px;border-radius:8px;text-align:center;font-size:13px;color:var(--muted);min-width:0;transition:background .15s ease, color .15s ease}
  .seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .ac-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:16px}

  .ac-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted)}
  .ac-row b{color:var(--text);font-weight:600;text-align:right;word-break:break-all}

  .auth{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
  .auth-card{width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .auth-mark{display:block;margin-bottom:2px}
  .auth-word{font-family:Archivo,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
  .auth-word em{font-style:normal;color:var(--accent)}
  .auth-sub{font-size:13px;color:var(--muted);text-align:center;line-height:1.45;margin-bottom:10px}
  .auth-in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;color:var(--text);outline:none}
  .auth-in:focus{border-color:var(--dim)}
  .auth-msg{width:100%;min-height:17px;font-size:12.5px;color:var(--accent-ink);text-align:center}
  .auth-skip{margin-top:4px;font-size:12.5px;color:var(--dim);text-decoration:underline;text-underline-offset:2px}

  .page-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 18px;min-height:84px}
  .page-head > *{position:relative;z-index:1}
  h1.page{font-family:Archivo,sans-serif;font-weight:800;font-size:31px;letter-spacing:-.03em;margin:0;line-height:1.02}
  .page-sub{font-size:13px;color:var(--muted);margin-top:5px}
  .head-actions{display:flex;gap:8px}
  .icon-btn{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);flex:none}
  .icon-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
  h2.section{font-family:Archivo,sans-serif;font-weight:700;font-size:16px;letter-spacing:-.015em;margin:0}
  .stack{display:flex;flex-direction:column;gap:12px}
  .stack-lg{display:flex;flex-direction:column;gap:24px}
  .row{display:flex;align-items:center;gap:10px}
  .spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

  .search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
  .search svg{color:var(--dim);flex:none}
  .search input{background:none;border:none;outline:none;width:100%;font-size:14.5px}
  .search input::placeholder{color:var(--dim)}

  .live{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:14px;padding:15px 16px;margin-bottom:20px;width:100%;display:block}
  .live-flag{display:block;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:4px}
  .live-name{display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.15}
  .live-meta{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .progress-track{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:12px}
  .progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

  .vol{display:flex;flex-direction:column;gap:9px}
  .vol-row{display:grid;grid-template-columns:86px 1fr 26px;align-items:center;gap:10px}
  .vol-chip{display:block;text-align:center;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 0;border:1px solid}
  .vol-track{display:block;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .vol-bar{display:block;height:100%;border-radius:99px}
  .vol-val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;text-align:right}

  .t-card{display:grid;grid-template-columns:1fr 18px;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .15s ease, transform .1s ease}
  .t-card:hover{border-color:var(--dim)}
  .t-card:active{transform:scale(.995)}
  .t-name{display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.2}
  .t-count{display:block;font-size:13px;font-weight:600;margin-top:5px}
  .t-day{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
  .t-card svg{color:var(--dim)}
  .t-sug{border-left:3px solid var(--accent)}
  .sug-flag{display:block;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:3px}
  .t-card.arch{opacity:.62}

  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;font-weight:500;padding:6px 0}

  .ex-list{display:flex;flex-direction:column;gap:8px}
  .grip{display:flex;align-items:center;justify-content:center;width:26px;margin-right:-4px;color:var(--dim);touch-action:none;cursor:grab}
  .grip:active{cursor:grabbing;color:var(--text)}
  .ex.ex-drag{grid-template-columns:26px 1fr auto 26px}
  .ex.dragging{position:relative;z-index:5;border-color:var(--accent);box-shadow:var(--shadow);opacity:.97}
  body.dragging-on{user-select:none}
  body.dragging-on .ex:not(.dragging){transition:transform .16s cubic-bezier(.22,.68,.36,1)}
  .ex{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s ease, transform .1s ease}
  .ex:hover{border-color:var(--dim)}
  .ex:active{transform:scale(.995)}
  .ex[data-done="1"]{background:var(--surface-2);border-color:var(--line-soft)}
  .ex-idx{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .ex[data-done="1"] .ex-idx{color:var(--good)}
  .ex-name{display:block;font-weight:500;line-height:1.25}
  .ex-sub{display:block;font-size:12.5px;margin-top:3px}
  .ex-swap{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;font-style:italic}
  .ex-load{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px;text-align:right;white-space:nowrap}
  .ex-load small{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-family:"Instrument Sans",sans-serif}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:500;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:13px 18px;font-weight:600;font-size:15px;background:var(--accent);color:#fff;width:100%;transition:filter .15s ease;text-align:center}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .btn.sm{padding:9px 14px;font-size:13.5px;width:auto;border-radius:9px}
  .btn.dashed{background:none;border:1px dashed var(--line);color:var(--muted);font-weight:500}
  .btn.danger{background:none;border:1px solid var(--line);color:var(--accent-ink)}

  .g-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g-box{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;min-height:104px;border-radius:16px;padding:18px 12px 14px;overflow:hidden;
    background:var(--surface);border:1px solid var(--line);
    transition:border-color .15s ease, transform .1s ease;
  }
  .g-box:hover{border-color:var(--dim)}
  .g-box:active{transform:scale(.985)}
  .g-box .glow{position:absolute;inset:0;z-index:0}
  .g-box .gn{position:relative;z-index:1;font-family:Archivo,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.025em;line-height:1.05;text-align:center;text-wrap:balance}
  .g-box .gm{position:relative;z-index:1;display:block;font-size:11.5px;color:var(--muted);margin-top:7px;text-align:center}

  .c-row{display:grid;grid-template-columns:1fr 62px 72px;gap:10px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;transition:border-color .15s ease}
  .c-row:hover{border-color:var(--dim)}
  .c-row .cn{font-size:14px;font-weight:500;line-height:1.25}
  .c-row .cg{display:block;font-size:11px;color:var(--dim);margin-top:2px}
  .c-row .cv{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:right;line-height:1.1}
  .c-row .cv span{font-size:10px;color:var(--muted);font-weight:500;font-family:"Instrument Sans",sans-serif;margin-left:2px}
  .c-row .cd{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;text-align:right;margin-top:2px}
  .spark{display:block;width:62px;height:26px;overflow:visible}

  .pr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .pr-box{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 10px 8px;overflow:hidden}
  .pr-box:hover{border-color:var(--dim)}
  .pr-box .pn{display:block;font-size:11.5px;font-weight:500;line-height:1.2;height:28px;overflow:hidden;color:var(--muted)}
  .pr-box .pv{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
  .pr-box .pv i{font-style:normal;font-size:10px;color:var(--muted);font-family:"Instrument Sans",sans-serif;margin-left:2px}
  .pr-box .spark{width:100%;height:22px;margin-top:4px}

  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .legend i{width:14px;height:2.5px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:6px}
  .legend span{font-size:11.5px;color:var(--muted)}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 11px}
  .tile .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .tile .v span{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px;font-family:"Instrument Sans",sans-serif}
  .tile .k{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.2}

  .cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:6px}
  .cal-head span{text-align:center;font-size:10.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cal-day{height:44px;min-width:0;padding:0;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px;background:var(--surface-2);color:var(--dim);border:1px solid transparent;width:100%}
  .cal-day.empty{background:none}
  .cal-day.has{color:var(--text);font-weight:600}
  .cal-day.today{border-color:color-mix(in srgb, var(--text) 45%, transparent)}
  .cal-day.sel{outline:2px solid var(--text);outline-offset:-2px;color:var(--text);font-weight:600}

  .lgd{width:14px;height:11px;border-radius:4px;display:inline-block}

  .pr-list{display:flex;flex-direction:column}
  .pr-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft);width:100%}
  .pr-row:last-child{border-bottom:none}
  .pr-name{font-size:14px;font-weight:500;line-height:1.25}
  .pr-date{font-size:11.5px;color:var(--dim);margin-top:2px}
  .pr-val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;font-size:15px;font-weight:600}
  .pr-val small{display:block;font-size:10.5px;color:var(--dim);font-weight:500;font-family:"Instrument Sans",sans-serif}

  .w-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);width:100%}
  .w-row:last-child{border-bottom:none}
  .w-date{font-size:12.5px;color:var(--muted);width:64px;text-align:left}
  .w-kg{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:left}
  .w-delta{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;color:var(--dim)}

  .field{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .field input{background:none;border:none;outline:none;width:100%;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:15px}
  .field input[type="date"]{font-family:"Instrument Sans",sans-serif;color-scheme:inherit}
  .field label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}

  :root{padding-bottom:0}

    var t = themePref();

    try { return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }

    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', THEME_BG[themeResolved()]);
  }

    var out = [];

        if (kg > top || (kg === top && x.reps > topReps)){ top = kg; topReps = x.reps; topSet = x; }
        vol += kg * x.reps;

      var maxReps = Math.max.apply(null, s.map(function(x){ return x.reps; }));
      out.push({date:w.started_at, workout:w, top:top, topReps:topReps, topSet:topSet, maxReps:maxReps, vol:vol, sets:s.length, detail:s});
    });

  function lineChart(opts){
    var W = 320, H = opts.height || 150;
    var pad = {t:12, r:opts.padRight||34, b:opts.hideX?8:20, l:opts.padLeft===undefined?30:opts.padLeft};
    var series = opts.series, all = [];
    series.forEach(function(s){ s.points.forEach(function(p){ all.push(p.y); }); });
    var min = Math.min.apply(null, all), max = Math.max.apply(null, all);
    var span = (max - min) || Math.max(1, max*0.1);
    min -= span*0.22; max += span*0.22;
    var n = series[0].points.length;
    var sx = function(i){ return pad.l + (n===1 ? (W-pad.l-pad.r)/2 : (i/(n-1))*(W-pad.l-pad.r)); };
    var sy = function(v){ return pad.t + (1 - (v-min)/(max-min))*(H-pad.t-pad.b); };
    var svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opts.aria||'gráfico')+'">';
    var ticks = opts.hideY ? [min+(max-min)*0.5] : [min+(max-min)*0.15, min+(max-min)*0.5, min+(max-min)*0.85];
    ticks.forEach(function(t){
      var y = sy(t);
      svg += '<line x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>';
      if (!opts.hideY) svg += '<text x="'+(pad.l-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9" font-family="IBM Plex Mono, monospace" fill="var(--dim)">'+Math.round(t)+'</text>';
    });
    series.forEach(function(s){
      var d = s.points.map(function(p,i){ return (i?'L':'M') + sx(i).toFixed(1) + ' ' + sy(p.y).toFixed(1); }).join(' ');
      if (s.area) svg += '<path d="'+d+' L '+sx(n-1).toFixed(1)+' '+(H-pad.b)+' L '+sx(0).toFixed(1)+' '+(H-pad.b)+' Z" fill="'+s.color+'" opacity=".09"/>';
      svg += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||2)+'" stroke-linecap="round" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="3 3"':'')+'/>';
      if (s.dots) s.points.forEach(function(p,i){
        svg += '<circle cx="'+sx(i).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="'+(i===n-1?4:2.3)+'" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2"/>';
      });
      if (s.endLabel) svg += '<text x="'+(sx(n-1)+7)+'" y="'+(sy(s.points[n-1].y)+3.5).toFixed(1)+'" font-size="10" font-weight="600" font-family="IBM Plex Mono, monospace" fill="'+s.color+'">'+s.endLabel+'</text>';
    });
    if (!opts.hideX){
      [0, Math.floor((n-1)/2), n-1].forEach(function(i,k){
        var p = series[0].points[i];
        if (!p || !p.label) return;
        svg += '<text x="'+sx(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="'+(k===0?'start':(k===2?'end':'middle'))+'" font-size="9.5" font-family="Instrument Sans, sans-serif" fill="var(--dim)">'+p.label+'</text>';
      });
    }
    return svg + '</svg>';
  }

  function sparkline(values, color){
    var W = 62, H = 26, pad = 3;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var span = (max - min) || 1, n = values.length;
    function xy(i){
      return [pad + (n === 1 ? (W-pad*2)/2 : (i/(n-1))*(W-pad*2)),
              pad + (1 - (values[i]-min)/span)*(H-pad*2)];
    }
    var d = values.map(function(v,i){ var p = xy(i); return (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var l = xy(n-1);
    return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="2.4" fill="'+color+'"/></svg>';
  }

  async function cloudPull(){
    var out = {};
    for (var i = 0; i < TABLES.length; i++){
      var r = await sb.from(TABLES[i]).select('*');
      if (r.error) throw r.error;
      out[TABLES[i]] = r.data || [];
    }
    if (!out.exercises.length && !out.workouts.length) return false;
    applyCloud(out);
    return true;
  }

  function schedulePush(ms){
    if (!CLOUD || !USER) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){ cloudPush(); }, ms === undefined ? 900 : ms);
  }

  async function cloudPush(){
    if (!CLOUD || !USER) return;
    if (pushing){ pushAgain = true; return; }
    pushing = true; setSync('busy');
    try {
      var R = buildRows();
      var i, j, tb, res;
      /* apaga primeiro: libera posição, dia e nome repetidos */
      for (i = TABLES.length - 1; i >= 0; i--){
        tb = TABLES[i];
        var alive = {}; R[tb].forEach(function(r){ alive[r.id] = 1; });
        var gone = Object.keys((SNAP && SNAP[tb]) || {}).filter(function(id){ return !alive[id]; });
        for (j = 0; j < gone.length; j += 150){
          res = await sb.from(tb).delete().in('id', gone.slice(j, j + 150));
          if (res.error) throw res.error;
        }
      }
      for (i = 0; i < TABLES.length; i++){
        tb = TABLES[i];
        var prev = (SNAP && SNAP[tb]) || {};
        var mod = R[tb].filter(function(r){ return prev[r.id] !== JSON.stringify(r); });
        for (j = 0; j < mod.length; j += 150){
          res = await sb.from(tb).upsert(mod.slice(j, j + 150), {onConflict:'id'});
          if (res.error) throw res.error;
        }
      }
      SNAP = snapOf(R);
      setSync('ok');
    } catch(e){
      setSync(navigator.onLine === false ? 'off' : 'err');
    }
    pushing = false;
    if (pushAgain){ pushAgain = false; schedulePush(400); }
  }

    var parts = String(u).split(','), mime = (parts[0].match(/:(.*?);/) || [,'image/jpeg'])[1];
    var bin = atob(parts[1]), n = bin.length, arr = new Uint8Array(n);
    while (n--) arr[n] = bin.charCodeAt(n);
    return new Blob([arr], {type:mime});
  }

  async function photoUrls(){
    if (!CLOUD || !USER || signing) return;
    var fresh = Date.now() - 6 * 60 * 60 * 1000;   /* reassina a cada 6h */
    var need = PHOTOS.filter(function(p){
      return p.path && (!p.src || !p.sat || p.sat < fresh);
    });
    if (!need.length) return;
    signing = true;
    try {
      for (var i = 0; i < need.length; i += 60){
        var lote = need.slice(i, i + 60);
        var r = await sb.storage.from('progress-photos')
          .createSignedUrls(lote.map(function(p){ return p.path; }), 60 * 60 * 24);
        if (r.error) throw r.error;
        (r.data || []).forEach(function(x, j){
          if (x && x.signedUrl){ lote[j].src = x.signedUrl; lote[j].sat = Date.now(); lote[j].tries = 0; }
        });
      }
      signWarned = false;
      renderFotos();
    } catch(e){
      if (!signWarned){ signWarned = true; toast('Não consegui carregar as fotos agora', 'warn'); }

    t.items.forEach(function(src){

  /* arrastar pelo punho: reordena os exercícios da sessão */
  function enableDrag(list){
    var GAP = 8, drag = null;

    function rowsOf(){ return Array.prototype.slice.call(list.querySelectorAll('.ex')); }

    function layout(){
      if (!drag) return;
      drag.rows.forEach(function(el, i){
        if (i === drag.from) return;
        var shift = 0;
        if (drag.from < i && i <= drag.to) shift = -(drag.h + GAP);
        else if (drag.to <= i && i < drag.from) shift = (drag.h + GAP);
        el.style.transform = shift ? 'translateY('+shift+'px)' : '';
      });
    }

    function onMove(ev){
      if (!drag) return;
      ev.preventDefault();
      var dy = ev.clientY - drag.y0;
      drag.el.style.transform = 'translateY('+dy+'px)';

      /* centro do arrastado contra o centro original dos outros */
      var center = drag.mid0 + dy, to = drag.from;
      for (var i = 0; i < drag.mids.length; i++){
        if (i === drag.from) continue;
        if (i < drag.from && center < drag.mids[i]) { to = Math.min(to, i); }
        if (i > drag.from && center > drag.mids[i]) { to = Math.max(to, i); }
      }
      if (to !== drag.to){ drag.to = to; layout(); }

      /* rola sozinho perto das bordas */
      var sc = document.querySelector('.app > main');
      if (sc){
        var r = sc.getBoundingClientRect();
        if (ev.clientY < r.top + 70) sc.scrollTop -= 10;
        else if (ev.clientY > r.bottom - 70) sc.scrollTop += 10;
      }
    }

    function onUp(){
      if (!drag) return;
      var from = drag.from, to = drag.to;
      drag.rows.forEach(function(el){ el.style.transform = ''; el.classList.remove('dragging'); });
      document.body.classList.remove('dragging-on');
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      drag = null;
      if (from !== to && activeSession){
        var a = activeSession.items, it = a.splice(from, 1)[0];
        a.splice(to, 0, it);
        touchState();
      }
      renderTreinoDetail();
    }

    Array.prototype.forEach.call(list.querySelectorAll('[data-grip]'), function(grip){
      grip.addEventListener('pointerdown', function(ev){
        if (ev.button !== undefined && ev.button !== 0) return;
        var rows = rowsOf(), el = grip.closest('.ex'), from = rows.indexOf(el);
        if (from < 0) return;
        ev.preventDefault();
        var rects = rows.map(function(r){ return r.getBoundingClientRect(); });
        drag = {
          el: el, rows: rows, from: from, to: from,
          y0: ev.clientY, h: rects[from].height,
          mid0: rects[from].top + rects[from].height / 2,
          mids: rects.map(function(r){ return r.top + r.height / 2; })
        };
        el.classList.add('dragging');
        document.body.classList.add('dragging-on');
        window.addEventListener('pointermove', onMove, {passive:false});
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      });
    });
  }

    document.getElementById('dsVolta').addEventListener('click', function(){
      fecha(); openTreino(voltarPara);
    });

    });
  }
  function markStarted(){
    if (activeSession && !activeSession.started){
      activeSession.started = true;
      activeSession.startedAt = new Date();
    }
  }
  function sessionCounts(){
    var total = 0, done = 0, vol = 0;
    if (!activeSession) return {total:0, done:0, vol:0, pct:0};
    activeSession.items.forEach(function(it){
      var rows = activeSession.log[it.uid] || [];
      var any = false;
      rows.forEach(function(r){
        if (r.warm) return;                       /* aquecimento não entra em nada */
        total++;
        if (r.done){ any = true; done++; vol += (r.kg||0)*(r.reps||0); }
      });
    });
    return {total:total, done:done, vol:vol, pct: total ? Math.round(done/total*100) : 0};
  }
  function finishSession(){
    var sets = [], swaps = [];
    activeSession.items.forEach(function(it){
      if (it.from) swaps.push({id:newId(), from:it.from, to:it.ex});
      activeSession.log[it.uid].forEach(function(s, i){
        if (!s.done) return;
        sets.push({id:newId(), exercise_id:it.ex, set_number:i+1, weight_kg:s.kg||0,
                   reps:s.reps||0, bw:isBw(it.ex), is_warmup: !!s.warm});
      });
    });
    if (sets.length){
      /* começo é o começo de verdade; sessão esquecida aberta não vira treino de 70 horas */
      var inicio = activeSession.startedAt || new Date();
      var mins = Math.max(1, Math.round((new Date() - inicio)/60000));
      if (mins > 240) mins = 240;
      WORKOUTS.push({id:newId(), treino_id:activeSession.treinoId, treino_name:activeSession.name,
                     started_at:inicio, duration_min: mins, sets:sets, swaps:swaps});
      WORKOUTS.sort(function(a,b){ return a.started_at - b.started_at; });
      reindexDays();
    }
    activeSession = null; openTreinoId = null;
    saveState();
    showTreinoList(); renderCargas(); renderAgenda();
  }

          return;

        '</div>';
    }).join('');

    Array.prototype.forEach.call(list.querySelectorAll('.ex'), function(btn){
      function open(ev){
        if (ev.target.closest && ev.target.closest('[data-grip]')) return;
        var uid = btn.getAttribute('data-uid');
        if (sessaoAtrapalha(t.id)){ pedirDescarte(t.id, function(){ ensureDraft(t.id); renderTreinoDetail(); }); return; }
        ensureDraft(t.id);
        var alvo = activeSession.items.filter(function(x){ return x.uid === uid; })[0] || activeSession.items[0];
        if (alvo) openLogSheet(alvo.uid);
      }
      btn.addEventListener('click', open);
      btn.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); open(ev); }
      });
    });
    if (live) enableDrag(list);
  }

  /* ===================== registro ===================== */
  function plateBreakdown(target){
    if (target <= 20) return null;
    var perSide = (target - 20)/2, plates = [20,15,10,5,2.5,1.25], out = [];
    plates.forEach(function(p){ while (perSide >= p - 0.001){ out.push(p); perSide = Math.round((perSide-p)*100)/100; } });
    return perSide < 0.01 ? out : null;
  }

  function openLogSheet(uid){
    var item = activeSession.items.filter(function(x){ return x.uid === uid; })[0];
    if (!item) return;
    var e = exById[item.ex], last = lastSessionFor(item.ex), rows = activeSession.log[uid], pr = prFor(item.ex), bw = isBw(item.ex);
    var prevText = last
      ? '<b>' + (bw ? 'PC' : fmt(last.top)+' kg') + '</b> × ' + last.detail.map(function(s){ return s.reps; }).join(', ') + ' — ' + shortDate(last.date)
      : 'Primeira vez com este exercício.';

    document.getElementById('sheetHost').innerHTML =
      '<div class="scrim" id="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-label="Registrar '+esc(exLabel(e))+'">' +
        '<div class="grabber"></div>' +
        '<div class="spread"><h3>'+esc(exLabel(e))+'</h3><button class="btn ghost sm" id="sheetClose">Fechar</button></div>' +
        '<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">' +
          '<span class="pill" style="background:transparent;border:1px solid '+gColor(e.g)+';color:'+gColor(e.g)+'">'+grupoLabel(e.g)+'</span>' +
          (pr ? '<span class="pill">PR '+(pr.bw ? 'PC' : fmt(pr.kg)+' kg')+' × '+pr.reps+'</span>' : '') +
        '</div>' +
        (item.from && exById[item.from] ? '<div class="note" style="margin-top:9px">No lugar de <strong>'+exLabel(exById[item.from])+'</strong> · '+FAM_LABEL[e.fam]+'</div>' : '') +
        '<div class="prev-note">Última sessão: '+prevText+'</div>' +
        '<div style="margin-top:16px"><div class="set-head"><span>#</span><span>Carga (kg)</span><span>Reps</span><span>OK</span></div>' +
          '<div id="setRows"></div></div>' +
        '<div id="plateHint"></div>' +
        '<div class="stp" style="margin-top:12px">' +
          '<button id="setMinus" aria-label="Menos séries">−</button>' +
          '<span>séries <b id="setCount">1</b></span>' +
          '<button id="setPlus" aria-label="Mais séries">+</button></div>' +
        '<div class="row" style="margin-top:12px;gap:8px">' +
          '<button class="btn ghost" id="swapBtn" style="flex:1">Trocar exercício</button>' +
          '<button class="btn ghost" id="removeBtn" style="flex:none;width:auto;padding-inline:16px;color:var(--muted)">Tirar</button></div>' +
        '<div style="margin-top:10px"><button class="btn" id="sheetDone">Pronto</button></div>' +
      '</div>';

    lockScroll(true);
    renderSetRows(item, rows);
    document.getElementById('scrim').addEventListener('click', closeSheet);
    document.getElementById('sheetClose').addEventListener('click', closeSheet);
    document.getElementById('sheetDone').addEventListener('click', closeSheet);

    function paintSets(){
      var c = document.getElementById('setCount');
      if (c) c.textContent = rows.length;
      var m = document.getElementById('setMinus');
      if (m){ m.disabled = rows.length <= 1; m.style.opacity = rows.length <= 1 ? '.25' : '1'; }
    }
    document.getElementById('setPlus').addEventListener('click', function(){
      rows.push({kg:null, reps:null, done:false, warm:false});
      renderSetRows(item, rows); paintSets(); renderTreinoDetail();
    });
    document.getElementById('setMinus').addEventListener('click', function(){
      if (rows.length <= 1) return;
      var ultima = rows[rows.length - 1];
      if (ultima.done && !confirmarTirar('setMinus', 'Tirar a série '+rows.length+'?')) return;
      rows.pop();
      renderSetRows(item, rows); paintSets(); renderTreinoDetail();
    });
    paintSets();

    document.getElementById('swapBtn').addEventListener('click', function(){ openSwapSheet(uid); });
    document.getElementById('removeBtn').addEventListener('click', function(){
      var feitas = rows.filter(function(r){ return r.done; }).length;
      if (feitas && !confirmarTirar('removeBtn', 'Tirar com '+feitas+(feitas===1?' série marcada?':' séries marcadas?'))) return;
      activeSession.items = activeSession.items.filter(function(x){ return x.uid !== uid; });
      delete activeSession.log[uid];
      touchState();
      closeSheet();
    });
  }

  function prCheck(exId, kg, reps){
    var h = historyFor(exId);
    if (!h.length) return null;
    var best = 0, bestReps = 0;
    h.forEach(function(p){
      p.detail.forEach(function(x){
        var w = setKg(x, p.date);
        if (melhorQue(w, x.reps, {kg:best, reps:bestReps})){ best = w; bestReps = x.reps; }
      });
    });
    if (kg > best) return {kind:'carga', text:'Recorde de carga · ' + fmt(kg) + ' kg (era ' + fmt(best) + ')'};
    if (kg === best && reps > bestReps) return {kind:'reps', text:'Recorde de repetição · ' + fmt(kg) + ' kg × ' + reps + ' (era ' + bestReps + ')'};
    return null;
  }

  var toastTimer = null;
  var TOAST_ICON = {
    ok:   '<path d="M5 12.5l4.5 4.5L19 7"/>',
    pr:   '<path d="M12 3l2.4 5.6 6.1.5-4.6 4 1.4 6-5.3-3.2L6.7 19l1.4-6-4.6-4 6.1-.5z"/>',
    warn: '<path d="M12 8v5M12 17h.01M10.3 3.9 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'
  };
  function toast(msg, tipo){
    tipo = TOAST_ICON[tipo] ? tipo : 'ok';
    var el = document.getElementById('toast');
    if (!el){
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.className = 'toast ' + tipo;
    el.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+TOAST_ICON[tipo]+'</svg><span>'+msg+'</span>';
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 3200);
  }

  /* dois toques pra apagar coisa marcada: o primeiro só avisa */
  var armados = {};
  function confirmarTirar(id, aviso){
    var b = document.getElementById(id);
    if (armados[id]) { armados[id] = false; if (b) b.textContent = b.getAttribute('data-txt') || b.textContent; return true; }
    armados[id] = true;
    if (b && !b.getAttribute('data-txt')) b.setAttribute('data-txt', b.textContent);
    toast(aviso + ' Toque de novo pra confirmar.', 'warn');
    setTimeout(function(){ armados[id] = false; }, 4000);
    return false;
  }

  /* acha o nome oficial, tolerando acento, caixa e os nomes antigos */
  function semAcento(t){
    return (t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
  }
  function tipoOficial(nome){
    if (!nome) return '';
    var a = semAcento(nome);
    for (var i = 0; i < CARDIO_TIPOS.length; i++)
      for (var j = 0; j < CARDIO_TIPOS[i][1].length; j++)
        if (semAcento(CARDIO_TIPOS[i][1][j]) === a) return CARDIO_TIPOS[i][1][j];
    return TIPO_ANTIGO[a] || '';
  }
  /* um protocolo é feito de blocos: cada bloco tem seus dias, seu tipo e seu alvo */
  function partsDe(c){
    if (c.parts && c.parts.length) return c.parts;
    c.parts = [{days:(c.days||[]).slice(), tipo: c.modality || c.name, target: c.target || {}}];
    return c.parts;
  }
  function diasDe(c){
    var out = [];
    partsDe(c).forEach(function(p){ (p.days||[]).forEach(function(d){ if (out.indexOf(d) < 0) out.push(d); }); });
    return out.sort();
  }
  function parteDoDia(c, dow){
    var ps = partsDe(c);
    for (var i = 0; i < ps.length; i++) if ((ps[i].days||[]).indexOf(dow) >= 0) return ps[i];
    return null;
  }
  function alvoDoDia(c, dow, chave){
    var p = parteDoDia(c, dow);
    return (p && p.target && p.target[chave]) || 0;
  }

  /* ---------- esforço percebido (RPE 1-10) ----------
     sem cinta cardíaca é assim que Strava e Apple medem intensidade.
     vigoroso conta em dobro, igual Garmin e Fitbit fazem com minuto em zona. */
  function faixaRpe(r){
    r = parseInt(r, 10) || 0;
    if (!r) return null;
    if (r <= 3) return {nome:'leve', peso:1};
    if (r <= 6) return {nome:'moderado', peso:1};
    return {nome:'vigoroso', peso:2};
  }
  function minEquiv(l){
    var f = faixaRpe(l.rpe);
    return Math.round((l.duration || 0) * (f ? f.peso : 1));
  }
  function ehVigoroso(l){ var f = faixaRpe(l.rpe); return !!f && f.peso > 1; }

  /* ---------- quais protocolos valiam numa semana ----------
     sem isso a meta de uma semana de agosto seria a do protocolo de hoje. */
  function protocolosDaSemana(off){
    var ws = weekStart(off), we = addDays(ws, 7);
    return CARDIOS.filter(function(c){
      if (c.created_at && new Date(c.created_at) >= we) return false;
      if (c.archived) return !!(c.archived_at && new Date(c.archived_at) >= ws);
      return true;
    });
  }
  /* aderência no estilo TrainingPeaks: verde dentro de ±20% do planejado */
  function aderencia(feito, plano, jaPassou){
    if (!plano) return feito ? 'ad-extra' : '';
    if (!feito) return jaPassou ? 'ad-nao' : '';
    var r = feito / plano;
    if (r >= 0.8 && r <= 1.2) return 'ad-ok';
    if ((r >= 0.5 && r < 0.8) || (r > 1.2 && r <= 1.5)) return 'ad-quase';
    return 'ad-fora';
  }

  function tipoExiste(nome){ return tipoOficial(nome) || null; }
  /* lista de tipos para escolher, com busca */
  function casaTipo(t, q){
    return semAcento(t).indexOf(q) >= 0 || semAcento(TIPO_APELIDO[t] || '').indexOf(q) >= 0;
  }
  function tipoPickerHtml(busca, atual){
    var q = semAcento(busca), out = '';
    /* se algum tipo bate pelo nome/apelido, mostro só eles; senão caio no nome do grupo */
    var porNome = !q || CARDIO_TIPOS.some(function(g){
      return g[1].some(function(t){ return casaTipo(t, q); });
    });
    CARDIO_TIPOS.forEach(function(grupo){
      var hits = grupo[1].filter(function(t){
        return !q || (porNome ? casaTipo(t, q) : semAcento(grupo[0]).indexOf(q) >= 0);
      });
      if (!hits.length) return;
      out += '<div class="eyebrow" style="margin:14px 0 7px">'+grupo[0]+'</div><div class="chips">' +
        hits.map(function(t){
          var on = t === atual;
          return '<button class="chip" data-tipo="'+t.replace(/"/g,'&quot;')+'"'+

        }).join('') + '</div>';
    });
    return out || '<div class="empty">Nenhum tipo com esse nome.</div>';
  }

  function cardioDetails(l){
    var d = [];
    if (l.distance) d.push(fmt(l.distance,1)+' km');
    if (l.incline) d.push(l.incline+'% inc.');
    if (l.level) d.push('nível '+l.level);
    if (l.rpe) d.push('esforço '+l.rpe);
    return d;
  }
  function alvoTexto(tg){
    var parts = [];
    if (tg.duration) parts.push(tg.duration + ' min');
    if (tg.distance) parts.push(fmt(tg.distance,1) + ' km');
    if (tg.incline) parts.push(tg.incline + '% inc.');
    if (tg.speed) parts.push(fmt(tg.speed,1) + ' km/h');
    if (tg.level) parts.push('nível ' + tg.level);
    return parts.join(' · ');
  }
  function resumoPartes(c){
    return partsDe(c).map(function(pt){
      var a = alvoTexto(pt.target || {});
      return daysLabel(pt.days) + ' · ' + (pt.tipo || '?') + (a ? ' · ' + a : '');
    }).join('<span style="color:var(--line)"> | </span>');
  }

  function cardioTargetParts(c){
    var t = c.target, parts = [];
    if (t.duration) parts.push(t.duration + ' min');
    if (t.incline) parts.push(t.incline + '% inc.');
    if (t.speed) parts.push(fmt(t.speed,1) + ' km/h');
    if (t.level) parts.push('nível ' + t.level);
    if (t.distance) parts.push(fmt(t.distance,1) + ' km');
    if (t.blocks) parts.push(t.blocks);
    return parts;
  }
  function daysLabel(days){
    if (!days || !days.length) return 'Sem dia fixo';
    return days.map(function(d){ return WEEKDAYS[d]; }).join(' · ');
  }

    var k = dayKey(today);

  }
  var cardioWeek = 0;   // 0 = semana atual, -1 = anterior...
  function weekStart(off){
    var d = new Date(today);
    d.setDate(d.getDate() - d.getDay() + (off || 0) * 7);
    d.setHours(0,0,0,0); return d;
  }
  function weekStripHtml(off, mode){
    var ws = weekStart(off), out = '';
    for (var i = 0; i < 7; i++){
      var dd = addDays(ws, i), k = dayKey(dd), isToday = k === dayKey(today);
      var doneTxt = '–', mark = '', state = 'off', extra = '';
      var temTreino = !!(workoutsByDay[k] && workoutsByDay[k].length) || !!MANUAL[k];
      var temCardio = (cardioByDay[k] || []).length > 0;
      if (temTreino && temCardio) extra = ' dia-duplo';
      else if (temTreino) extra = ' dia-treino';
      else if (temCardio) extra = ' dia-cardio';
      if (mode === 'cardio'){
        var dc = cardioByDay[k] || [];
        var sc = protocolosDaSemana(off).filter(function(c){ return !!parteDoDia(c, i); });
        var feitoMin = dc.reduce(function(a,l){ return a+(l.duration||0); },0);
        var planMin  = sc.reduce(function(a,c){ return a+alvoDoDia(c, i, 'duration'); },0);
        if (dc.length){ state = 'done'; mark = '✓'; doneTxt = feitoMin || '–'; }
        else if (planMin){ state = 'plan'; mark = '·'; doneTxt = planMin; }
        /* na aba Cardio a cor é de aderência, não o verde do calendário de treinos */
        extra = ' ' + aderencia(feitoMin, planMin, dd < today && k !== dayKey(today));
      } else {
        var w = (workoutsByDay[k] || []).length;
        var st = activeTreinos().filter(function(t){ return t.dow === i; })[0];
        if (w || MANUAL[k]){ state = 'done'; mark = '✓'; }
        else if (st){ state = 'plan'; mark = '·'; }
      }
      out += '<button class="wk-day '+state+extra+(isToday?' wk-today':'')+'" data-wkday="'+k+'">' +
        '<span class="wk-n">'+WEEKDAYS[i].charAt(0)+'</span>' +
        '<span class="wk-dot">'+mark+'</span>' +
        (mode === 'cardio' ? '<span class="wk-m">'+doneTxt+'</span>' : '') +
        '</button>';
    }
    return out;
  }

  function weekCardHtml(off, mode, id){

  function bindWeekCard(id, get, set, rerender, mode){
    var card = document.getElementById(id);
    if (!card) return;
    bindAll(card, '[data-wk]', function(b){
      var d = +b.getAttribute('data-wk');
      if (d > 0 && get() >= 0) return;
      set(get() + d); rerender();
    });
    bindAll(card, '[data-wkday]', function(b){
      var k = b.getAttribute('data-wkday');
      // dia vazio na aba de treinos: um toque marca verde, outro desmarca
      if (mode === 'treino' && !(workoutsByDay[k] && workoutsByDay[k].length)){
        if (dayFromIso(keyToIso(k)) > hoje()){ toast('Esse dia ainda nem chegou', 'warn'); return; }
        if (MANUAL[k]){ delete MANUAL[k]; toast('Marcação removida'); }
        else { MANUAL[k] = {treino_id:null}; toast('Dia marcado como treinado'); }
        rerender(); renderAgenda();
        return;
      }
      selectedDay = k; showAgenda();
    });
    var x0 = null;
    function st(x){ x0 = x; }
    function en(x){
      if (x0 === null) return;
      var dx = x - x0; x0 = null;
      if (Math.abs(dx) < 42) return;
      if (dx > 0){ set(get() - 1); rerender(); }
      else if (get() < 0){ set(get() + 1); rerender(); }
    }
    card.addEventListener('touchstart', function(e){ st(e.touches[0].clientX); }, {passive:true});
    card.addEventListener('touchend', function(e){ en(e.changedTouches[0].clientX); }, {passive:true});
    card.addEventListener('pointerdown', function(e){ if (e.pointerType !== 'touch') st(e.clientX); });
    card.addEventListener('pointerup', function(e){ if (e.pointerType !== 'touch') en(e.clientX); });
  }

  function weekRangeLabel(off){
    var a = weekStart(off), b = addDays(a, 6);
    var f = function(d){ return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); };
    return f(a) + ' – ' + f(b);
  }

  function renderCardio(){
    touchState();
    var host = document.getElementById('cardioList');
    if (!host) return;
    if (openCardioId){ renderCardioDetail(); return; }

    var ws = weekStart(cardioWeek), we = addDays(ws, 7);
    var weekLogs = CARDIO_LOGS.filter(function(l){ return l.date >= ws && l.date < we; });
    var mins  = weekLogs.reduce(function(a,l){ return a + (l.duration || 0); }, 0);
    var equiv = weekLogs.reduce(function(a,l){ return a + minEquiv(l); }, 0);
    var minVig = weekLogs.filter(ehVigoroso).reduce(function(a,l){ return a + (l.duration||0); }, 0);
    /* o plano da semana usa os protocolos que valiam naquela semana */
    var planned = 0;
    protocolosDaSemana(cardioWeek).forEach(function(c){
      partsDe(c).forEach(function(pt){
        planned += (pt.days || []).length * ((pt.target || {}).duration || 0);
      });
    });
    /* o alvo é a minha meta, se eu tiver posto uma; senão é o próprio plano */
    var meta = SETTINGS.metaSemanal || planned;
    var resumo = meta ? (mins + ' de ' + meta + ' min') : (mins + ' min');
    /* a conta na cara, pra ninguém ficar adivinhando de onde vem o número */
    var conta = weekLogs.length + (weekLogs.length === 1 ? ' sessão' : ' sessões');
    if (minVig) conta += ' · ' + minVig + ' min no vigoroso (' + equiv + ' min equivalentes)';
    if (SETTINGS.metaSemanal && planned) conta += ' · plano do protocolo: ' + planned + ' min';

        activeCardios().map(function(c){
          var done = doneToday(c.id);

          return '<div class="cd-card'+(istoday?' cd-today':'')+'">' +
            '<button class="cd-main" data-cardio="'+c.id+'">' +

              '<span class="cd-name">'+esc(c.name)+'</span>' +

              '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(done?3:2.2)+'" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>' +

  /* o dia que a folha abre: na semana atual é hoje, numa semana passada é um dia daquela semana */
  function diaPadraoDaSemana(c){
    if (!cardioWeek) return new Date();
    var ws = weekStart(cardioWeek), ultimo = null, planejado = null, hk = dayKey(today);
    for (var i = 0; i < 7; i++){
      var dd = addDays(ws, i);
      if (dayKey(dd) === hk) { ultimo = dd; break; }
      if (dd > today) break;
      ultimo = dd;
      if (c && parteDoDia(c, i)) planejado = dd;
    }
    return planejado || ultimo || addDays(ws, 6);
  }

  var kTipoBusca = '';

    var pt = c ? (parteDoDia(c, quando.getDay()) || partsDe(c)[0]) : null;
    var tipo = (pt && tipoExiste(pt.tipo)) || null;
    var tipoNaMao = false;        /* se eu escolhi o tipo na mão, trocar o dia não mexe nele */

    var form = {};                /* o que já foi digitado, pra não perder ao re-renderizar */

      if (!document.getElementById('kDur')) return;
      form = readCardioForm();
    }
    function render(){
      document.getElementById('sheetHost').innerHTML =
        '<div class="scrim" id="scrimC"></div>' +
        '<div class="sheet" role="dialog" aria-label="Registrar cardio">' +

          '<div class="spread"><h3>'+(escolhendo ? 'O que você fez?' : 'Registrar cardio')+'</h3>' +

      return '<div class="search" style="margin-top:14px">' +
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
          '<input id="kBusca" type="search" value="'+kTipoBusca.replace(/"/g,'&quot;')+'" placeholder="corrida, bicicleta, nado..." aria-label="Buscar tipo"></div>' +
        '<div id="kTipos">' + tipoPickerHtml(kTipoBusca, tipo) + '</div>';

    function ligarTipo(){
      var inp = document.getElementById('kBusca');

    function ligarChips(){
      bindAll(document.getElementById('kTipos'), '[data-tipo]', function(b){
        tipo = b.getAttribute('data-tipo');

    function dicaHtml(){
      var t = (pt && pt.target) || {};

      var mesmoDia = !!parteDoDia(c, quando.getDay());
      return '<div class="prev-note" id="kDica">' +
        (mesmoDia ? 'Meta de ' + WEEKDAYS[quando.getDay()].toLowerCase() : 'Meta do protocolo') +
        ': <strong>' + (pt.tipo || '') + '</strong> · ' + a + '</div>';
    }
    function painelDados(){
      var t = (pt && pt.target) || {};
      return (c ? '<div class="note" style="margin-top:8px">Protocolo <strong>'+esc(c.name)+'</strong>. Preencha o que você fez de verdade.</div>' : '') +
        '<button class="ed-row" id="kTipoBtn" style="width:100%;margin-top:14px;text-align:left">' +
          '<span><span class="ed-n">'+tipo+'</span>' +
            '<span class="ed-e">toque para trocar o tipo</span></span>' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>' +
        '<div style="margin-top:12px"><div class="field">' +
          '<input id="kDate" type="date" value="'+isoDay(quando)+'" max="'+isoDay(new Date())+'" aria-label="Dia">' +
          '<label for="kDate">dia</label></div></div>' +
        dicaHtml() +
        cardioFormFields(form, t) +
        '<div style="margin-top:16px"><button class="btn" id="kSave" style="background:var(--cardio)">Salvar</button></div>';
    }
    function ligarDados(){
      ligarRpe();
      document.getElementById('kTipoBtn').addEventListener('click', function(){
        guardaForm(); escolhendo = true; kTipoBusca = ''; render();
      });
      document.getElementById('kDate').addEventListener('change', function(){
        guardaForm();
        quando = lerData('kDate', quando);
        if (c){
          var np = parteDoDia(c, quando.getDay()) || partsDe(c)[0];
          pt = np;
          if (!tipoNaMao){
            var nt = (np && tipoExiste(np.tipo)) || tipo;
            if (nt !== tipo){ tipo = nt; }
          }
        }
        render();
      });
      document.getElementById('kSave').addEventListener('click', function(){
        var f = readCardioForm();
        if (!f.duration){
          toast('Quanto tempo durou?', 'warn');
          document.getElementById('kDur').focus(); return;
        }
        CARDIO_LOGS.push({
          id:newId(),
          cardio_id: c ? c.id : null,
          name: tipo, modality: tipo,
          date: lerData('kDate', quando), duration: f.duration, distance: f.distance,
          incline: f.incline, level: f.level, rpe: f.rpe
        });
        CARDIO_LOGS.sort(function(a,b){ return a.date - b.date; });
        reindexDays(); touchState(); closeCardioSheet(); renderAgenda();
        toast('Cardio registrado');
      });
    }

    render();
  }

  /* ---------- criar / editar protocolo de cardio ---------- */
  var cdDraft = null, cdBusca = '', cdPick = null;
  function openCardioEditor(id){
    var c = id ? cardioById[id] : null;
    function limpaAlvo(t){
      t = t || {};
      return {duration:t.duration||'', distance:t.distance||'', incline:t.incline||'',
              level:t.level||'', speed:t.speed||''};
    }
    cdDraft = c
      ? {id:c.id, name:c.name, note:c.note||'',
         parts: partsDe(c).map(function(pt){
           return {days:(pt.days||[]).slice(), tipo:pt.tipo||'', target:limpaAlvo(pt.target)};
         })}
      : {id:null, name:'', note:'', parts:[{days:[], tipo:'', target:limpaAlvo(null)}]};
    cdPick = null; cdBusca = '';
    renderCardioEditor();
  }

  function renderCardioEditor(){
    var d = cdDraft;
    var host = document.getElementById('sheetHost');

    /* escolhendo o tipo de um bloco */
    if (cdPick !== null){
      host.innerHTML =
        '<div class="scrim" id="scrimCD"></div>' +
        '<div class="sheet" role="dialog" aria-label="Tipo de cardio">' +
          '<div class="grabber"></div>' +
          '<div class="spread"><h3>Tipo de cardio</h3>' +
            '<button class="btn ghost sm" id="cdVolta">Voltar</button></div>' +
          '<div class="search" style="margin-top:14px">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
            '<input id="cdBusca" type="search" value="'+cdBusca.replace(/"/g,'&quot;')+'" placeholder="corrida, bicicleta, nado..." aria-label="Buscar tipo"></div>' +
          '<div id="cdTipos">' + tipoPickerHtml(cdBusca, d.parts[cdPick].tipo) + '</div>' +
        '</div>';
      lockScroll(true);
      function voltar(){ cdPick = null; cdBusca = ''; renderCardioEditor(); }
      document.getElementById('scrimCD').addEventListener('click', voltar);
      document.getElementById('cdVolta').addEventListener('click', voltar);
      document.getElementById('cdBusca').addEventListener('input', function(ev){
        cdBusca = ev.target.value;
        document.getElementById('cdTipos').innerHTML = tipoPickerHtml(cdBusca, d.parts[cdPick].tipo);
        ligaChips();
      });
      function ligaChips(){
        bindAll(document.getElementById('cdTipos'), '[data-tipo]', function(b){
          d.parts[cdPick].tipo = b.getAttribute('data-tipo');
          voltar();
        });
      }
      ligaChips();
      return;
    }

    function campo(i, k, lab, step){
      return '<div class="ed-f"><label>'+lab+'</label><input type="number"'+(step?' step="'+step+'"':'')+
        ' inputmode="decimal" value="'+d.parts[i].target[k]+'" data-t="'+k+'" data-pi="'+i+'" aria-label="'+lab+'"></div>';
    }
    function blocoHtml(pt, i){
      return '<div class="card" style="padding:13px;margin-bottom:10px">' +
        '<div class="spread" style="margin-bottom:10px">' +
          '<button class="cd-tipo" data-pick="'+i+'">' +
            '<span class="ed-n">'+(pt.tipo || 'Escolher tipo')+'</span>' +
            '<span class="ed-e">'+(pt.tipo ? 'toque para trocar' : 'obrigatório')+'</span></button>' +
          (d.parts.length > 1
            ? '<button class="ed-x" data-del="'+i+'" aria-label="Remover bloco">×</button>' : '') +
        '</div>' +
        '<div class="dow">' + WEEKDAYS.map(function(w, dow){
            var on = pt.days.indexOf(dow) >= 0;
            return '<button class="dow-b'+(on?' on':'')+'" data-d="'+dow+'" data-pi="'+i+'" style="'+
              (on?'background:var(--cardio);border-color:var(--cardio);color:#fff':'')+'">'+w.charAt(0)+'</button>';
          }).join('') + '</div>' +
        '<div class="ed-grid">' + campo(i,'duration','min') + campo(i,'distance','km','0.1') +
          campo(i,'incline','% inc','0.5') + campo(i,'level','nível') + '</div>' +
        '<div class="ed-grid" style="grid-template-columns:1fr 1fr">' +
          campo(i,'speed','km/h','0.1') + '</div>' +
      '</div>';
    }

    host.innerHTML =
      '<div class="scrim" id="scrimCD"></div>' +
      '<div class="sheet" role="dialog" aria-label="Protocolo de cardio">' +
        '<div class="grabber"></div>' +
        '<div class="spread"><h3>'+(d.id ? 'Editar protocolo' : 'Novo protocolo')+'</h3>' +
          '<button class="btn ghost sm" id="cdClose">Fechar</button></div>' +
        '<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Nome do protocolo</div>' +
          '<input class="txt" id="cdName" type="text" value="'+d.name.replace(/"/g,'&quot;')+'" placeholder="Cardio da semana" aria-label="Nome"></div>' +
        '<div class="eyebrow" style="margin:18px 0 8px">O que fazer em cada dia</div>' +
        d.parts.map(blocoHtml).join('') +
        '<button class="btn dashed" id="cdAdd">+ Outro tipo em outros dias</button>' +
        '<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Observação</div>' +
          '<input class="txt" id="cdNote" type="text" value="'+d.note.replace(/"/g,'&quot;')+'" placeholder="opcional" aria-label="Observação"></div>' +
        '<div style="margin-top:20px"><button class="btn" id="cdSave" style="background:var(--cardio)">'+
          (d.id ? 'Salvar' : 'Criar protocolo')+'</button></div>' +
      '</div>';
    lockScroll(true);

    document.getElementById('scrimCD').addEventListener('click', closeCardioSheet);
    document.getElementById('cdClose').addEventListener('click', closeCardioSheet);
    document.getElementById('cdName').addEventListener('input', function(e){ d.name = e.target.value; });
    document.getElementById('cdNote').addEventListener('input', function(e){ d.note = e.target.value; });

    bindAll(host, '[data-pick]', function(b){
      cdPick = +b.getAttribute('data-pick'); cdBusca = ''; renderCardioEditor();
    });
    bindAll(host, '[data-del]', function(b){
      d.parts.splice(+b.getAttribute('data-del'), 1); renderCardioEditor();
    });
    document.getElementById('cdAdd').addEventListener('click', function(){
      d.parts.push({days:[], tipo:'', target:{duration:'',distance:'',incline:'',level:'',speed:''}});
      cdPick = d.parts.length - 1; cdBusca = ''; renderCardioEditor();
    });
    bindAll(host, '.dow-b', function(b){
      var dow = +b.getAttribute('data-d'), i = +b.getAttribute('data-pi');
      var dias = d.parts[i].days, k = dias.indexOf(dow);
      if (k >= 0) dias.splice(k, 1);
      else {
        /* um dia pertence a um bloco só */
        d.parts.forEach(function(outro, j){
          if (j === i) return;
          var o = outro.days.indexOf(dow);
          if (o >= 0) outro.days.splice(o, 1);
        });
        dias.push(dow); dias.sort();
      }
      renderCardioEditor();
    });
    Array.prototype.forEach.call(host.querySelectorAll('.ed-f input'), function(inp){
      inp.addEventListener('input', function(){
        d.parts[+inp.getAttribute('data-pi')].target[inp.getAttribute('data-t')] = inp.value;
      });
    });

    document.getElementById('cdSave').addEventListener('click', function(){
      if (!d.name.trim()){ document.getElementById('cdName').focus(); return; }
      var faltaTipo = d.parts.filter(function(pt){ return !tipoExiste(pt.tipo); }).length;
      if (faltaTipo){ toast('Escolha o tipo de cada bloco', 'warn'); return; }
      var semDia = d.parts.filter(function(pt){ return !pt.days.length; }).length;
      if (semDia){ toast('Marque os dias de cada bloco', 'warn'); return; }

      var parts = d.parts.map(function(pt){
        var tgt = {};
        ['duration','distance','incline','level','speed'].forEach(function(k){
          var v = parseFloat(pt.target[k]);
          if (!isNaN(v) && v > 0) tgt[k] = v;
        });
        return {days:pt.days.slice(), tipo:pt.tipo, target:tgt};
      });

      if (d.id){
        var c2 = cardioById[d.id];
        c2.name = d.name.trim(); c2.note = d.note.trim(); c2.parts = parts;
        c2.modality = parts[0].tipo; c2.days = diasDe(c2); c2.target = parts[0].target;
      } else {
        var novo = {id:newId(), name:d.name.trim(), archived:false, note:d.note.trim(),
                    created_at:new Date().toISOString(), archived_at:null,
                    parts:parts, modality:parts[0].tipo, days:[], target:parts[0].target};
        novo.days = diasDe(novo);
        CARDIOS.push(novo);
      }
      reindexCardios(); cdDraft = null; cdPick = null;
      touchState(); closeCardioSheet();
      toast('Protocolo salvo');
    });
  }

  var ceBusca = '';
  function openCardioEditSheet(logId){
    var l = CARDIO_LOGS.filter(function(x){ return x.id === logId; })[0];
    if (!l) return;
    var quando = new Date(l.date);
    var tipo = tipoExiste(l.name) || l.name || 'Outro';
    var escolhendo = false, confirmando = false;
    var form = {duration:l.duration, distance:l.distance, incline:l.incline, level:l.level, rpe:l.rpe};
    ceBusca = '';

    function guardaForm(){ if (document.getElementById('kDur')) form = readCardioForm(); }

    function render(){
      document.getElementById('sheetHost').innerHTML =
        '<div class="scrim" id="scrimCE"></div>' +
        '<div class="sheet" role="dialog" aria-label="Editar sessão">' +
          '<div class="grabber"></div>' +
          '<div class="spread"><h3>'+(escolhendo ? 'Trocar o tipo' : 'Editar sessão')+'</h3>' +
            '<button class="btn ghost sm" id="ceClose">Fechar</button></div>' +
          (escolhendo ? painelTipo() : painelDados()) +
        '</div>';
      lockScroll(true);
      document.getElementById('scrimCE').addEventListener('click', closeCardioSheet);
      document.getElementById('ceClose').addEventListener('click', closeCardioSheet);
      if (escolhendo) ligarTipo(); else ligarDados();
    }

    function painelTipo(){
      return '<div class="search" style="margin-top:14px">' +
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
          '<input id="ceBusca" type="search" value="'+ceBusca.replace(/"/g,'&quot;')+'" placeholder="corrida, bicicleta, nado..." aria-label="Buscar tipo"></div>' +
        '<div id="ceTipos">' + tipoPickerHtml(ceBusca, tipo) + '</div>';
    }
    function ligarTipo(){
      document.getElementById('ceBusca').addEventListener('input', function(ev){
        ceBusca = ev.target.value;
        document.getElementById('ceTipos').innerHTML = tipoPickerHtml(ceBusca, tipo);
        chips();
      });
      chips();
      function chips(){
        bindAll(document.getElementById('ceTipos'), '[data-tipo]', function(b){
          tipo = b.getAttribute('data-tipo'); escolhendo = false; render();
        });
      }
    }

    function painelDados(){
      return '<button class="ed-row" id="kTipoBtn" style="width:100%;margin-top:14px;text-align:left">' +
          '<span><span class="ed-n">'+tipo+'</span>' +
            '<span class="ed-e">toque para trocar o tipo</span></span>' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>' +
        '<div style="margin-top:12px"><div class="field">' +
          '<input id="kDate" type="date" value="'+isoDay(quando)+'" max="'+isoDay(new Date())+'" aria-label="Dia">' +
          '<label for="kDate">dia</label></div></div>' +
        cardioFormFields(form) +
        '<div style="margin-top:16px"><button class="btn" id="ceSave" style="background:var(--cardio)">Salvar</button></div>' +
        '<div style="margin-top:12px"><button class="btn '+(confirmando?'danger':'ghost')+'" id="ceDel">' +
          (confirmando ? 'Confirmar exclusão — não dá pra desfazer' : 'Excluir sessão') + '</button></div>' +
        (confirmando ? '<div style="margin-top:8px"><button class="btn ghost sm" id="ceCancel">Cancelar</button></div>' : '');
    }
    function ligarDados(){
      ligarRpe();
      document.getElementById('kTipoBtn').addEventListener('click', function(){
        guardaForm(); escolhendo = true; ceBusca = ''; render();
      });
      document.getElementById('ceSave').addEventListener('click', function(){
        var f = readCardioForm();
        if (!f.duration){
          toast('Quanto tempo durou?', 'warn');
          document.getElementById('kDur').focus(); return;
        }
        l.name = tipo; l.modality = tipo;
        l.duration = f.duration; l.distance = f.distance;
        l.incline = f.incline; l.level = f.level; l.rpe = f.rpe;
        l.date = lerData('kDate', quando);
        CARDIO_LOGS.sort(function(a,b){ return a.date - b.date; });
        reindexDays(); touchState();
        closeCardioSheet(); renderAgenda();
      });
      document.getElementById('ceDel').addEventListener('click', function(){
        if (!confirmando){ guardaForm(); confirmando = true; render(); return; }
        CARDIO_LOGS = CARDIO_LOGS.filter(function(x){ return x.id !== logId; });
        reindexDays(); touchState(); closeCardioSheet(); renderAgenda();
        toast('Sessão excluída', 'warn');
      });
      var cancel = document.getElementById('ceCancel');
      if (cancel) cancel.addEventListener('click', function(){ guardaForm(); confirmando = false; render(); });
    }

    render();
  }

  function openMetaSheet(){
    var val = SETTINGS.metaSemanal || 0;
    function render(){
      document.getElementById('sheetHost').innerHTML =
        '<div class="scrim" id="scrimMT"></div>' +
        '<div class="sheet" role="dialog" aria-label="Meta semanal de cardio">' +
          '<div class="grabber"></div>' +
          '<div class="spread"><h3>Meta da semana</h3>' +
            '<button class="btn ghost sm" id="mtClose">Fechar</button></div>' +
          '<div class="note" style="margin-top:10px">Sem meta, o alvo da semana é a soma do que teus protocolos pedem.</div>' +
          '<div class="chips" style="margin-top:14px">' +
            '<button class="chip" data-meta="0"'+(!val?' style="border-color:var(--cardio);color:var(--cardio)"':'')+'>Seguir o plano</button>' +
            [60,90,120,150,180].map(function(v){
              return '<button class="chip" data-meta="'+v+'"'+(v===val?' style="border-color:var(--cardio);color:var(--cardio)"':'')+'>'+v+' min</button>';
            }).join('') + '</div>' +
          '<div style="margin-top:14px"><div class="field">' +
            '<input id="mtVal" type="number" inputmode="numeric" value="'+(val||'')+'" placeholder="deixe vazio pra seguir o plano" aria-label="Meta em minutos">' +
            '<label for="mtVal">min/semana</label></div></div>' +
          '<div style="margin-top:16px"><button class="btn" id="mtSave" style="background:var(--cardio)">Salvar</button></div>' +
        '</div>';
      lockScroll(true);
      document.getElementById('scrimMT').addEventListener('click', closeCardioSheet);
      document.getElementById('mtClose').addEventListener('click', closeCardioSheet);
      bindAll(document.getElementById('sheetHost'), '[data-meta]', function(b){
        val = +b.getAttribute('data-meta'); render();
      });
      document.getElementById('mtSave').addEventListener('click', function(){
        var v = parseInt(document.getElementById('mtVal').value, 10) || 0;
        if (v && (v < 10 || v > 2000)){ toast('Põe algo entre 10 e 2000 min', 'warn'); return; }
        SETTINGS.metaSemanal = v; touchState(); closeCardioSheet();
        toast(v ? ('Meta: ' + v + ' min por semana') : 'Sem meta — segue o plano');
      });
    }
    render();
  }

  function closeCardioSheet(){
    document.getElementById('sheetHost').innerHTML = '';
    lockScroll(false);
    renderCardio();
  }

  /* ===================== CARGAS ===================== */
  var cargaGroup = null, cargaQuery = '';

  function compactRow(e){
    var m = exMetric(e), color = gColor(e.g);
    if (!m){
      return '<button class="c-row" data-carga="'+e.id+'">' +
        '<span><span class="cn">'+esc(e.name)+'</span><span class="cg">'+esc(e.eq)+'</span></span>' +
        '<span></span><span><span class="cv" style="color:var(--dim);font-size:11px;white-space:nowrap">sem registro</span></span></button>';
    }
    return '<button class="c-row" data-carga="'+e.id+'">' +
      '<span><span class="cn">'+esc(e.name)+'</span><span class="cg">'+esc(e.eq)+'</span></span>' +
      sparkline(m.series, color) +
      '<span><span class="cv">'+fmt(m.last)+'<span>'+m.unit+'</span></span>' +
        '<span class="cd" style="color:'+(m.delta>=0?'var(--good)':'var(--accent-ink)')+'">'+(m.delta>=0?'+':'')+fmt(m.delta)+'</span></span></button>';
  }

  function renderCargas(){
    touchState();
    var head = document.getElementById('cargaHead'), body = document.getElementById('cargaBody');
    if (!head) return;

    if (cargaQuery.length > 1){
      head.innerHTML = '<div class="page-head">'+watermark()+'<div><h1 class="page">Cargas</h1>' +
        '<div class="page-sub">Resultados para “'+cargaQuery+'”</div></div></div>';
      var hits = EXERCISES.filter(function(e){ return exLabel(e).toLowerCase().indexOf(cargaQuery) >= 0; });
      body.innerHTML = hits.length
        ? '<div class="ex-list">' + hits.map(compactRow).join('') + '</div>'
        : '<div class="empty">Nenhum exercício para “'+cargaQuery+'”.</div>';
      bindAll(body, '[data-carga]', function(b){ openCargaSheet(b.getAttribute('data-carga')); });
      return;
    }

    if (cargaGroup){
      var list = EXERCISES.filter(function(e){ return e.g === cargaGroup; });
      list.sort(function(a,b){
        var ha = historyFor(a.id).length, hb = historyFor(b.id).length;
        if ((ha>0) !== (hb>0)) return hb - ha;
        return a.name.localeCompare(b.name,'pt-BR');
      });
      var color = gColor(cargaGroup);
      head.innerHTML =
        '<button class="back" id="cargaBack"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Cargas</button>' +
        '<div class="page-head" style="padding-bottom:12px">' + watermark(color) + '<div>' +
          '<h1 class="page" style="font-size:27px;color:'+color+'">'+grupoLabel(cargaGroup)+'</h1>' +
          '<div class="page-sub">'+list.length+' exercício'+(list.length>1?'s':'')+' neste grupo</div></div></div>';
      document.getElementById('cargaBack').addEventListener('click', function(){ cargaGroup = null; renderCargas(); });
      body.innerHTML = list.length
        ? '<div class="ex-list">' + list.map(compactRow).join('') + '</div>'
        : '<div class="empty">Nenhum exercício neste grupo.</div>';
      bindAll(body, '[data-carga]', function(b){ openCargaSheet(b.getAttribute('data-carga')); });
      return;
    }

    head.innerHTML = '<div class="page-head">'+watermark()+'<div><h1 class="page">Cargas</h1>' +
      '<div class="page-sub">Histórico e evolução de cada exercício</div></div>' +
      '<div class="head-actions"><button class="icon-btn primary" id="cargaNew" aria-label="Criar exercício">' +
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button></div></div>';

    var cn = document.getElementById('cargaNew');
    if (cn) cn.addEventListener('click', function(){
      openNewExercise(function(e){ openCargaSheet(e.id); }, closeSheet, '');
    });

    var prs = EXERCISES.map(function(e){ return {e:e, pr:prFor(e.id), m:exMetric(e)}; })
      .filter(function(x){ return x.pr && x.m; })
      .sort(function(a,b){ return b.pr.date - a.pr.date; }).slice(0, 3);

    var html = '';
    if (prs.length){
      html += '<div class="stack" style="margin-bottom:24px"><h2 class="section">Recordes recentes</h2>' +
        '<div class="pr-grid">' + prs.map(function(x){
          var c = gColor(x.e.g);
          return '<button class="pr-box" data-carga="'+x.e.id+'">' +
            '<span class="pn">'+x.e.name+'</span>' +
            '<span class="pv" style="color:'+c+'">'+(x.pr.bw ? x.pr.reps : fmt(x.pr.kg))+'<i>'+(x.pr.bw ? 'reps' : 'kg')+'</i></span>' +
            sparkline(x.m.series, c) + '</button>';
        }).join('') + '</div></div>';
    }

    var groupStats = GROUP_ORDER.map(function(g){
      return {g:g, n: EXERCISES.filter(function(e){ return e.g === g; }).length};
    }).filter(function(s){ return s.n > 0; });

    html += '<div class="stack"><h2 class="section">Por grupo</h2>' +
      '<div class="g-grid">' + groupStats.map(function(s){
        var c = gColor(s.g);

  function openCargaSheet(exId){

            '<div style="text-align:right"><div class="eyebrow">'+m.h.length+' sessões</div>' +

              (m.delta>=0?'+':'')+fmt(m.delta)+' '+m.unit+'</div>' +
              (m.bw ? '' : '<div class="num" style="font-size:12px;font-weight:600;color:'+(m.deltaReps>=0?'var(--good)':'var(--accent-ink)')+'">'+
